<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Sado Investment OS — User, AI and GitHub System Overview</title>
<desc id="desc">User on smartphone or PC uses ChatGPT/Codex or Pages/Cockpit. GitHub hosts intake, proposed change, owner approval, canonical state, deterministic logic and derived read models. OpenAI API is an external reasoning service. Broker and market events are not observed until imported or communicated. Solid lines are current; dashed lines are evolution.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.t{font:600 21px system-ui,sans-serif;fill:#0f172a}.s{font:16px system-ui,sans-serif;fill:#334155}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.g{fill:#f8fafc;stroke:#64748b;stroke-width:2}.os{fill:#f8fbff;stroke:#2563eb;stroke-width:3}.ln{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.ev{stroke-dasharray:9 8}</style></defs>
<text x="60" y="55" class="t">Sado Investment OS — User, AI and GitHub System Overview</text><text x="60" y="82" class="s">CURRENT = solid / EVOLUTION = dashed</text>
<rect x="45" y="135" rx="18" width="240" height="610" class="g"/><text x="75" y="175" class="t">User / Devices</text><rect x="75" y="220" width="180" height="88" rx="12" class="g"/><text x="100" y="255" class="t">👑 Owner</text><text x="100" y="282" class="s">判断・合意・質問</text><rect x="75" y="350" width="180" height="72" rx="12" class="g"/><text x="112" y="395" class="t">Smartphone</text><rect x="75" y="455" width="180" height="72" rx="12" class="g"/><text x="145" y="500" class="t">PC</text><rect x="75" y="585" width="180" height="105" rx="12" class="g"/><text x="95" y="622" class="t">External world</text><text x="95" y="651" class="s">Broker / Market / IR / News</text>
<rect x="335" y="135" rx="18" width="300" height="610" class="g"/><text x="370" y="175" class="t">Primary interfaces</text><rect x="375" y="235" width="220" height="110" rx="12" class="p"/><text x="405" y="275" class="t">ChatGPT / Codex</text><text x="405" y="305" class="s">対話UI / Semantic interface</text><rect x="375" y="405" width="220" height="110" rx="12" class="b"/><text x="410" y="445" class="t">Pages / Cockpit</text><text x="410" y="475" class="s">OS UI / read-only中心</text><rect x="375" y="575" width="220" height="105" rx="12" class="g"/><text x="405" y="612" class="t">GitHub / CSV</text><text x="405" y="642" class="s">AIを介さない入力経路</text>
<rect x="700" y="115" rx="20" width="825" height="680" class="os"/><text x="740" y="160" class="t">GitHub上: Sado Investment OS</text>
<rect x="745" y="215" width="205" height="100" rx="12" class="p"/><text x="775" y="253" class="t">Semantic Gateway</text><text x="775" y="282" class="s">意図理解・変更提案</text><rect x="745" y="360" width="205" height="100" rx="12" class="b"/><text x="785" y="398" class="t">Input / Validation</text><text x="785" y="427" class="s">Parse・Normalize</text><rect x="1000" y="290" width="210" height="110" rx="12" class="b"/><text x="1038" y="330" class="t">Proposed Change</text><text x="1030" y="360" class="s">まだCanonicalではない</text><rect x="1260" y="290" width="210" height="110" rx="12" class="b"/><text x="1305" y="330" class="t">Owner Approval</text><text x="1300" y="360" class="s">採用・棄却・修正</text>
<rect x="790" y="525" width="220" height="110" rx="12" class="b"/><text x="825" y="565" class="t">GitHub Substrate</text><text x="815" y="595" class="s">Issue・Git・PR・Review・Actions</text><rect x="1055" y="525" width="200" height="110" rx="12" class="b"/><text x="1088" y="565" class="t">Canonical State</text><text x="1080" y="595" class="s">事実・判断・履歴・ルール</text><rect x="1300" y="500" width="185" height="95" rx="12" class="b"/><text x="1325" y="538" class="t">Deterministic</text><text x="1342" y="568" class="s">検証・計算・Build</text><rect x="1300" y="635" width="185" height="95" rx="12" class="b"/><text x="1320" y="673" class="t">Derived Read</text><text x="1345" y="703" class="s">Pages用判断材料</text><rect x="1055" y="665" width="200" height="90" rx="12" class="p"/><text x="1090" y="700" class="t">AI Task Adapter</text><text x="1090" y="728" class="s">外部Model呼出し</text>
