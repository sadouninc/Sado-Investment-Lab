<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="t d"><title id="t">Versioned Input and Self-evolving Observation</title><desc id="d">A new signal requirement leads to a proposed sensor, rule, config or agent contract change, then branch and pull request, review and validation, merge, and a new observation dimension. Existing observation is current; automated external triggering and replay remain evolution.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.x{font:600 20px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#334155}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.g{fill:#f8fafc;stroke:#64748b;stroke-width:2}.e{fill:#fff;stroke:#64748b;stroke-width:2;stroke-dasharray:9 8}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.de{stroke-dasharray:9 8}</style></defs><text x="60" y="55" class="x">Diagram 3 — Versioned Input / Self-evolving Observation</text><text x="60" y="84" class="s">観測データだけでなく「何をどう観測するか」自体をGitでreview可能にする。</text><rect x="55" y="160" width="210" height="110" rx="12" class="g"/><text x="90" y="200" class="x">New Signal Need</text><text x="82" y="232" class="s">新しいrisk / theme / source</text><rect x="325" y="160" width="250" height="110" rx="12" class="p"/><text x="350" y="200" class="x">Mechanism Proposal</text><text x="350" y="232" class="s">sensor / rule / config / agent contract</text><rect x="635" y="160" width="190" height="110" rx="12" class="b"/><text x="670" y="200" class="x">Branch / PR</text><text x="665" y="232" class="s">versioned proposal</text><rect x="885" y="160" width="215" height="110" rx="12" class="b"/><text x="920" y="200" class="x">Review / Validate</text><text x="912" y="232" class="s">Authority + deterministic checks</text><rect x="1160" y="160" width="160" height="110" rx="12" class="b"/><text x="1205" y="200" class="x">Merge</text><text x="1188" y="232" class="s">accepted change</text><rect x="1115" y="350" width="250" height="120" rx="12" class="b"/><text x="1145" y="392" class="x">New Observation Dimension</text><text x="1145" y="425" class="s">以後のOSが新しい観測方法を持つ</text><path d="M265 215H325" class="l"/><path d="M575 215H635" class="l"/><path d="M825 215H885" class="l"/><path d="M1100 215H1160" class="l"/><path d="M1240 270V350" class="l"/><rect x="90" y="370" width="380" height="130" rx="12" class="g"/><text x="120" y="410" class="x">CURRENT</text><text x="120" y="443" class="s">rules / workflows / scripts / validators / config</text><text x="120" y="474" class="s">Git historyで変更理由とversionを追跡</text><rect x="555" y="370" width="390" height="130" rx="12" class="e"/><text x="585" y="410" class="x">EVOLUTION</text><text x="585" y="443" class="s">external triggerの一般化 / replay engine</text><text x="585" y="474" class="s">future capabilityをCURRENT扱いしない</text><path d="M945 435H1115" class="l de"/><rect x="430" y="545" width="650" height="70" rx="12" class="g"/><text x="475" y="588" class="s">Past Canonical State + Past Logic → historical reproduction ／ + New Logic → future replay候補</text></svg>