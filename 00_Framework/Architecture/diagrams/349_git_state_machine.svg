<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="t d"><title id="t">Git as State Machine</title><desc id="d">A raw change becomes a proposed change, branch and commit, pull request, review and CI result, then either rejection or merge into canonical state N plus one. Diff explains what changed and SHA anchors reproducibility. Merge is not investment approval.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.x{font:600 20px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#334155}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.g{fill:#f8fafc;stroke:#64748b;stroke-width:2}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.r{fill:#fff7ed;stroke:#ea580c;stroke-width:2}</style></defs><text x="60" y="55" class="x">Diagram 2 — Git as State Machine</text><rect x="50" y="150" width="160" height="100" rx="12" class="g"/><text x="92" y="190" class="x">State N</text><text x="72" y="220" class="s">既存Canonical state</text><rect x="270" y="150" width="185" height="100" rx="12" class="g"/><text x="300" y="190" class="x">Raw Change</text><text x="292" y="220" class="s">新Evidence / Requirement</text><rect x="515" y="150" width="190" height="100" rx="12" class="b"/><text x="540" y="190" class="x">Branch + Commit</text><text x="553" y="220" class="s">isolated proposal</text><rect x="765" y="150" width="170" height="100" rx="12" class="b"/><text x="830" y="190" class="x">PR</text><text x="800" y="220" class="s">reviewable transition</text><rect x="995" y="125" width="200" height="150" rx="12" class="b"/><text x="1035" y="170" class="x">Review / CI</text><text x="1020" y="202" class="s">Authority / quality</text><text x="1020" y="232" class="s">deterministic checks</text><rect x="1260" y="75" width="185" height="100" rx="12" class="r"/><text x="1305" y="115" class="x">Rejected</text><text x="1287" y="145" class="s">修正または棄却</text><rect x="1260" y="245" width="185" height="100" rx="12" class="b"/><text x="1310" y="285" class="x">Merge</text><text x="1288" y="315" class="s">accepted transition</text><rect x="1045" y="420" width="220" height="100" rx="12" class="b"/><text x="1100" y="460" class="x">State N+1</text><text x="1070" y="490" class="s">新Canonical state</text><path d="M210 200H270" class="l"/><path d="M455 200H515" class="l"/><path d="M705 200H765" class="l"/><path d="M935 200H995" class="l"/><path d="M1195 165H1260" class="l"/><path d="M1195 235L1260 285" class="l"/><path d="M1352 345V390H1155V420" class="l"/><rect x="70" y="365" width="390" height="125" rx="12" class="g"/><text x="105" y="405" class="x">Reviewability / Reproduction</text><text x="105" y="438" class="s">diff = 前状態から何が変わったか</text><text x="105" y="468" class="s">SHA = 再現可能な時点anchor</text><rect x="535" y="365" width="405" height="125" rx="12" class="g"/><text x="570" y="405" class="x">Authority boundary</text><text x="570" y="438" class="s">Issue Close ≠ feature completion</text><text x="570" y="468" class="s">merge ≠ BUY/SELL approval</text></svg>