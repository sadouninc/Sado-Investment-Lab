<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="t d"><title id="t">Runtime Architecture</title><desc id="d">Current event flow separates AI semantic interpretation from deterministic logic. GitHub is the operating substrate. Derived read models feed Pages and Cockpit, while final judgment remains with the owner.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#334155"/></marker><style>.x{font:600 20px system-ui;fill:#0f172a}.s{font:15px system-ui;fill:#334155}.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.g{fill:#f8fafc;stroke:#64748b;stroke-width:2}.l{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><text x="60" y="55" class="x">Diagram 1 — Runtime Architecture (CURRENT)</text><rect x="60" y="130" width="190" height="105" rx="12" class="g"/><text x="95" y="170" class="x">Input / Event</text><text x="82" y="202" class="s">Owner / Market / Research / GitHub</text><rect x="310" y="130" width="230" height="105" rx="12" class="p"/><text x="345" y="170" class="x">AI Semantic Layer</text><text x="340" y="202" class="s">意味理解・Fact分離・scope整理</text><rect x="600" y="105" width="260" height="155" rx="16" class="b"/><text x="625" y="150" class="x">GitHub Operating Substrate</text><text x="645" y="184" class="s">Issue / files / branch / commit / PR</text><text x="662" y="215" class="s">review / CI / merge / history</text><rect x="930" y="75" width="220" height="105" rx="12" class="b"/><text x="965" y="115" class="x">Canonical State</text><text x="955" y="147" class="s">受理された永続状態</text><rect x="930" y="220" width="220" height="105" rx="12" class="b"/><text x="950" y="260" class="x">Deterministic Logic</text><text x="970" y="292" class="s">検証・計算・Build</text><rect x="1210" y="150" width="220" height="105" rx="12" class="b"/><text x="1235" y="190" class="x">Derived Read Model</text><text x="1255" y="222" class="s">表示用判断材料</text><rect x="1210" y="360" width="220" height="105" rx="12" class="b"/><text x="1240" y="400" class="x">Pages / Cockpit</text><text x="1248" y="432" class="s">safe read projection</text><rect x="920" y="515" width="230" height="105" rx="12" class="g"/><text x="985" y="555" class="x">👑 Owner</text><text x="955" y="587" class="s">最終判断・質問・変更要求</text><rect x="585" y="515" width="275" height="105" rx="12" class="g"/><text x="620" y="555" class="x">Next Event / Intent</text><text x="625" y="587" class="s">新しい観測・要求・Trade Intent</text><path d="M250 182H310" class="l"/><path d="M540 182H600" class="l"/><path d="M860 150H930" class="l"/><path d="M860 220H930" class="l"/><path d="M1150 127L1210 185" class="l"/><path d="M1150 272L1210 220" class="l"/><path d="M1320 255V360" class="l"/><path d="M1210 412H1100V515" class="l"/><path d="M920 567H860" class="l"/><path d="M585 567H440V235" class="l"/><rect x="335" y="320" width="795" height="105" rx="14" class="g"/><text x="385" y="360" class="x">Safety boundary</text><text x="385" y="392" class="s">AI Semantic Layer ≠ Deterministic Logic / CI green ≠ 投資判断正解 / merge ≠ BUY・SELL承認</text></svg>