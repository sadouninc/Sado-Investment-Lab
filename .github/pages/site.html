<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{{ page.title }} — Sado Investment Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/book.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['$', '$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="progress"></span></div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="表示テーマを切り替える">◐</button>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">Sado Investment Lab</a>
    <nav class="site-nav" aria-label="共通ナビゲーション">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/framework/' | relative_url }}">Framework</a>
      <a href="{{ '/themes/' | relative_url }}">Themes</a>
      <a href="{{ '/companies/' | relative_url }}">Companies</a>
      <a href="{{ '/market-analysis/' | relative_url }}">Market Analysis</a>
      <a href="{{ '/research/market-phase/ai-semiconductor/' | relative_url }}">Market Phase</a>
      <a href="{{ '/research/investor-dna/' | relative_url }}">Investor DNA</a>
      <a href="{{ '/research/morning-dataset/' | relative_url }}">Morning Dataset</a>
      <a href="{{ '/research/ai-key-person-watch/' | relative_url }}">AI Key Person Watch</a>
      <a href="{{ '/reports/morning/' | relative_url }}">AI Morning</a>
      <a href="{{ '/architecture/' | relative_url }}">Architecture</a>
      <a href="{{ '/trade-journal/' | relative_url }}">Trade Journal</a>
      <a href="{{ '/trade-analysis/' | relative_url }}">Trade Analysis</a>
    </nav>
  </header>
  <main class="book-shell">
    {{ content }}
  </main>
  <a class="back-to-top" href="#" aria-label="ページ上部へ戻る">↑</a>
  <script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('book-theme');
    if (savedTheme) root.dataset.theme = savedTheme;
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('book-theme', next);
    });
    const progress = document.getElementById('progress');
    const updateProgress = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? window.scrollY / max * 100 : 0) + '%';
    };
    addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();

    (() => {
      const normalizedPath = window.location.pathname.replace(/\/+$/, '');
      if (!normalizedPath.endsWith('/research/ai-key-person-watch')) return;
      const main = document.querySelector('main.book-shell');
      const title = main?.querySelector('h1');
      if (!main || !title) return;

      const panel = document.createElement('section');
      panel.className = 'notice-card';
      panel.setAttribute('aria-live', 'polite');
      panel.innerHTML = '<strong>Monitoring status</strong><p>Heartbeatを確認中...</p>';
      title.insertAdjacentElement('afterend', panel);

      const statusUrl = 'https://raw.githubusercontent.com/sadouninc/Sado-Investment-Lab/main/Ops/Monitoring/AI_Key_Person_Watch/status.json';
      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const renderTime = (value) => value
        ? new Date(value).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) + ' JST'
        : '未記録';
      const classify = (payload) => {
        const lastSuccess = payload.last_success_at ? new Date(payload.last_success_at) : null;
        if (!lastSuccess || Number.isNaN(lastSuccess.getTime())) {
          return { state: 'STALE', reason: '成功runがまだ記録されていません。' };
        }
        const ageMinutes = (Date.now() - lastSuccess.getTime()) / 60000;
        const staleAfter = Number(payload.stale_after_minutes || 150);
        if (ageMinutes > staleAfter) {
          return { state: 'STALE', reason: `最終成功runから約${Math.floor(ageMinutes)}分経過しています。` };
        }
        if (payload.last_status === 'ERROR') return { state: 'DEGRADED', reason: '直近runがERRORです。' };
        if (payload.persistence_status === 'PENDING_PERSIST') return { state: 'DEGRADED', reason: 'ニュース保存がPENDING_PERSISTです。' };
        return { state: 'HEALTHY', reason: '直近の成功runは監視閾値内です。' };
      };

      fetch(`${statusUrl}?t=${Date.now()}`, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((payload) => {
          const health = classify(payload);
          panel.innerHTML = `<strong>Monitoring status: ${escapeHtml(health.state)}</strong><dl>`
            + `<dt>最終監視成功</dt><dd>${escapeHtml(renderTime(payload.last_success_at))}</dd>`
            + `<dt>最終ニュース差分</dt><dd>${escapeHtml(renderTime(payload.last_news_delta_at))}</dd>`
            + `<dt>直近run</dt><dd>${escapeHtml(renderTime(payload.last_run_at))}</dd>`
            + `<dt>状態理由</dt><dd>${escapeHtml(health.reason)}</dd></dl>`;
        })
        .catch((error) => {
          panel.innerHTML = `<strong>Monitoring status: UNKNOWN</strong><p>Heartbeatの取得に失敗しました: ${escapeHtml(error.message)}</p>`;
        });
    })();
  </script>
</body>
</html>
