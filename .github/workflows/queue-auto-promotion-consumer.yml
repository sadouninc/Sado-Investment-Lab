name: Queue Auto-Promotion Consumer

# Issue #556: fail-closed scheduled queue consumer. Bounded-scans safe
# READY_FOR_IMPLEMENTATION Issues and hands at most one safe candidate per
# tick to the existing canonical AI Production Dispatch
# (ai-production-dispatch.yml), without depending on a scheduled ChatGPT
# Issue comment. This workflow performs no merges and never selects
# Issue #79.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: queue-auto-promotion-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bounded scan of safe READY candidates (no GitHub writes)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=READY_FOR_IMPLEMENTATION&per_page=20" > /tmp/issues-raw.json
          jq '[.[] | select((.pull_request // null) == null and .number != 79) | {number, title, state, body}]' /tmp/issues-raw.json > /tmp/issues-candidates.json
          echo "Bounded candidate pool: $(jq 'length' /tmp/issues-candidates.json) open READY_FOR_IMPLEMENTATION issue(s) (Issue #79 excluded)."

          SAFE='[]'
          for number in $(jq -r '.[].number' /tmp/issues-candidates.json); do
            : > /tmp/comment-pages.jsonl
            page=1
            while :; do
              gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100&page=${page}" > /tmp/comment-page.json
              jq -c '.' /tmp/comment-page.json >> /tmp/comment-pages.jsonl
              count="$(jq 'length' /tmp/comment-page.json)"
              [[ "$count" == "100" ]] || break
              page=$((page + 1))
            done
            jq -s 'add // []' /tmp/comment-pages.jsonl > /tmp/comments.json
            if jq -e --arg n "$number" \
              'any(.[]; (.body // "") as $b | ($b | test("AUTO_ROUTER_DISPATCH lease_id=.* executor=COPILOT target_issue=" + $n + "\\b")))' \
              /tmp/comments.json >/dev/null; then
              echo "Issue #${number} already has an existing canonical lease marker; excluding from this tick (duplicate-active-lease fail-closed)."
              continue
            fi
            ISSUE_ENTRY="$(jq --arg n "$number" '.[] | select(.number == ($n|tonumber))' /tmp/issues-candidates.json)"
            SAFE="$(jq -c --argjson entry "$ISSUE_ENTRY" '. + [$entry]' <<< "$SAFE")"
          done
          echo "$SAFE" > /tmp/issues.json
          echo "candidate_count=$(jq 'length' /tmp/issues.json)" >> "$GITHUB_OUTPUT"

      - name: Collect active conflicting-PR paths (bounded, no writes)
        id: active
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=30" > /tmp/open-prs.json
          : > /tmp/active-paths.jsonl
          for pr in $(jq -r '.[].number' /tmp/open-prs.json); do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/files?per_page=100" | jq -r '.[].filename' >> /tmp/active-paths.jsonl
          done
          jq -R -s -c 'split("\n") | map(select(length > 0)) | unique' /tmp/active-paths.jsonl > /tmp/active-paths.json
          echo '[]' > /tmp/active-owner-slices.json

      - name: Compute one safe queue-consumer tick (no GitHub writes)
        id: tick
        shell: bash
        run: |
          set -euo pipefail
          echo '{"copilot":"available"}' > /tmp/worker-state.json
          BASE_SHA="$(git rev-parse HEAD)"
          python -m scripts.queue_auto_promotion_consumer \
            --issues /tmp/issues.json \
            --worker-state /tmp/worker-state.json \
            --active-owner-slices /tmp/active-owner-slices.json \
            --active-paths /tmp/active-paths.json \
            --base-sha "$BASE_SHA" \
            --output /tmp/packet.json || true
          status="$(jq -r '.status' /tmp/packet.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Queue consumer tick status: $status"
          if [[ "$status" == "DISPATCH_READY" ]]; then
            echo "issue_number=$(jq -r '.selected.issue_number' /tmp/packet.json)" >> "$GITHUB_OUTPUT"
            echo "lease_id=$(jq -r '.dispatch.workflow_dispatch.inputs.lease_id' /tmp/packet.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Post canonical lease evidence and invoke AI Production Dispatch
        if: steps.tick.outputs.status == 'DISPATCH_READY'
        env:
          ISSUE_NUMBER: ${{ steps.tick.outputs.issue_number }}
          LEASE_ID: ${{ steps.tick.outputs.lease_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo INVALID_ISSUE_NUMBER; exit 78; }
          [[ "$ISSUE_NUMBER" != "79" ]] || { echo PROTECTED_ISSUE_79; exit 79; }
          [[ "$LEASE_ID" =~ ^lease-[0-9a-f]{32}$ ]] || { echo INVALID_LEASE_ID; exit 78; }
          {
            jq -r '.dispatch.evidence_comment' /tmp/packet.json
            echo
            echo
            echo "担当: 🌊ナギ"
            echo "種別: Autonomous Queue Consumer / Canonical Lease Evidence"
            echo
            echo "Bounded safe-selection tick (Issue #556) selected this Issue for the existing canonical AI Production Dispatch. Fail-closed duplicate/lease/path/authority checks remain authoritative downstream."
          } > /tmp/evidence-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@/tmp/evidence-comment.md >/dev/null
          gh workflow run ai-production-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$ISSUE_NUMBER" -f lease_id="$LEASE_ID"

      - name: No safe candidate this tick
        if: steps.tick.outputs.status != 'DISPATCH_READY'
        shell: bash
        run: |
          echo "Queue consumer tick result: ${{ steps.tick.outputs.status }}. No executor dispatch this tick (fail-closed)."
