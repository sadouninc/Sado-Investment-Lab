name: Queue Auto-Promotion Consumer

# Issue #556: fail-closed scheduled queue consumer. Bounded-scans safe
# READY_FOR_IMPLEMENTATION Issues and hands at most one safe candidate per
# tick to the existing canonical AI Production Dispatch
# (ai-production-dispatch.yml), without depending on a scheduled ChatGPT
# Issue comment. This workflow performs no merges and never selects
# Issue #79.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

concurrency:
  group: queue-auto-promotion-consumer
  cancel-in-progress: false

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bounded scan of safe READY candidates (no GitHub writes)
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          # Read every API page before applying the bounded candidate limit. The
          # issues endpoint also returns PRs, so limiting the first page can hide
          # READY Issues behind unrelated PR entries.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=READY_FOR_IMPLEMENTATION&per_page=100" \
            | jq 'add // []' > /tmp/issues-raw.json
          jq '[.[] | select((.pull_request // null) == null and .number != 79) | {number, title, state, body}][:20]' /tmp/issues-raw.json > /tmp/issues-candidates.json
          echo "Bounded candidate pool: $(jq 'length' /tmp/issues-candidates.json) open READY_FOR_IMPLEMENTATION issue(s) (Issue #79 excluded)."

          SAFE='[]'
          for number in $(jq -r '.[].number' /tmp/issues-candidates.json); do
            : > /tmp/comment-pages.jsonl
            page=1
            while :; do
              gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments?per_page=100&page=${page}" > /tmp/comment-page.json
              jq -c '.' /tmp/comment-page.json >> /tmp/comment-pages.jsonl
              count="$(jq 'length' /tmp/comment-page.json)"
              [[ "$count" == "100" ]] || break
              page=$((page + 1))
            done
            jq -s 'add // []' /tmp/comment-pages.jsonl > /tmp/comments.json
            # Canonical lease state is carried by flow-dispatch JSON events.
            # A historical AUTO_ROUTER_DISPATCH marker alone is not an active lease.
            # Latest relevant event wins; malformed/ambiguous active lease fails closed.
            LEASE_STATE="$(jq -r --arg n "$number" '
              def comment_event:
                (.body // "") as $b
                | (try ($b | fromjson | select(type == "object")) catch null) as $whole
                | (if $whole != null then [$whole]
                   else [$b | split("\n")[] | try (fromjson | select(type == "object")) catch empty]
                   end) as $objects
                | ($objects
                   | map(select((.work_ref // "") == ("issue:" + $n) or (.owner_slice // "") == ("issue-" + $n)))) as $events
                | ($b | split("\n")
                   | map(select(test("^\\s*[\\{\\[]")) | try fromjson catch null)
                   | any(. == null)) as $malformed_json_line
                | ($b | contains("flow-dispatch-lease") or contains("AUTO_ROUTER_DISPATCH")) as $lease_marker
                | ($b | test("\"work_ref\"\\s*:\\s*\"issue:" + $n + "(?:[^0-9]|$)")
                   or test("\"owner_slice\"\\s*:\\s*\"issue-" + $n + "(?:[^0-9]|$)")) as $target_hint
                # Count target references, including prose-prefixed or multiline
                # malformed fragments which fromjson cannot turn into events.
                # A valid event may carry both work_ref and owner_slice.
                | ($b | [match("\"work_ref\"\\s*:\\s*\"issue:" + $n + "(?:[^0-9]|$)"; "g"),
                         match("\"owner_slice\"\\s*:\\s*\"issue-" + $n + "(?:[^0-9]|$)"; "g")]
                   | length) as $target_ref_count
                | ($events | map(
                    (if .work_ref? == ("issue:" + $n) then 1 else 0 end) +
                    (if .owner_slice? == ("issue-" + $n) then 1 else 0 end)
                  ) | add // 0) as $parsed_ref_count
                | ($events | any(
                    (.work_ref? != null and .work_ref != ("issue:" + $n)) or
                    (.owner_slice? != null and .owner_slice != ("issue-" + $n))
                  )) as $conflicting_identity
                # A lease whose work_ref and owner_slice disagree must not
                # authorize a retry or dispatch for either issue.
                | if $conflicting_identity or ($events | length) > 1 or $target_ref_count > $parsed_ref_count then {"status":"AMBIGUOUS_LEASE_EVENT"}
                  elif ($lease_marker or $target_hint) and $malformed_json_line then {"status":"AMBIGUOUS_LEASE_EVENT"}
                  elif ($events | length) == 1 then $events[0]
                  # A target hint embedded in prose (not a standalone JSON line)
                  # is not a validated lease. Treat it as ambiguous, never NONE.
                  elif $target_hint then {"status":"AMBIGUOUS_LEASE_EVENT"}
                  elif $lease_marker then {"status":"AMBIGUOUS_LEASE_EVENT"}
                  else empty end;
              [ .[] | comment_event ] | last // {} |
              if ((.status // "") | IN("PROMOTION_DISPATCHED","PROMOTION_BRANCH_READY","PR_CREATE_REQUIRED","DUPLICATE_SUPERSEDED","PR_ALREADY_EXISTS","PR_ALREADY_EXISTS_RACE_RESOLVED")) then "TERMINALIZING"
              elif ((.status // "") | IN("DISPATCH_LEASE_EXPIRED","COPILOT_RETRYABLE_FAILURE","RETRYABLE_FAILURE","FALLBACK_RETRYABLE_FAILURE","BLOCKED_BASE_DRIFT","BLOCKED_CONTRACT_REPLAY","FAIL_CLOSED")) then "RETRYABLE"
              elif ((.status // "") | IN("ASSIGNED","ACKNOWLEDGED","FALLBACK_ASSIGNED")) then
                if ((.lease_expires_at // "") == "") then "AMBIGUOUS"
                elif ((try (.lease_expires_at | fromdateiso8601) catch null) == null) then "AMBIGUOUS"
                elif ((.lease_expires_at | fromdateiso8601) > now) then "ACTIVE"
                else "EXPIRED"
                end
              elif (.status // "") == "" then "NONE"
              else "AMBIGUOUS"
              end' /tmp/comments.json)"
            case "$LEASE_STATE" in
              ACTIVE|TERMINALIZING|AMBIGUOUS)
                echo "Issue #${number} canonical lease state=${LEASE_STATE}; excluding this tick (fail-closed)."
                continue
                ;;
              EXPIRED|RETRYABLE|NONE)
                echo "Issue #${number} canonical lease state=${LEASE_STATE}; eligible for fresh preflight."
                ;;
              *)
                echo "Issue #${number} unknown canonical lease state; excluding this tick (fail-closed)."
                continue
                ;;
            esac
            ISSUE_ENTRY="$(jq --arg n "$number" '.[] | select(.number == ($n|tonumber))' /tmp/issues-candidates.json)"
            SAFE="$(jq -c --argjson entry "$ISSUE_ENTRY" '. + [$entry]' <<< "$SAFE")"
          done
          echo "$SAFE" > /tmp/issues.json
          echo "candidate_count=$(jq 'length' /tmp/issues.json)" >> "$GITHUB_OUTPUT"

      - name: Collect active conflicting-PR paths (bounded, no writes)
        id: active
        shell: bash
        run: |
          set -euo pipefail
          # Fetch all open PRs; an incomplete conflict inventory must never dispatch.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" | jq 'add // []' > /tmp/open-prs.json
          : > /tmp/active-paths.jsonl
          for pr in $(jq -r '.[].number' /tmp/open-prs.json); do
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${pr}/files?per_page=100" \
              | jq -r 'add // [] | .[].filename' >> /tmp/active-paths.jsonl
          done
          jq -R -s -c 'split("\n") | map(select(length > 0)) | unique' /tmp/active-paths.jsonl > /tmp/active-paths.json
          # PR bodies are not a trustworthy canonical owner registry. Until an
          # authoritative owner-slice reader is wired, block dispatch whenever
          # any open PR exists rather than pretending the owner set is empty.
          if [[ "$(jq 'length' /tmp/open-prs.json)" -gt 0 ]]; then
            echo "::warning::OWNER_SLICE_INVENTORY_UNVERIFIED: open PRs present; dispatch disabled (fail-closed)"
            echo '["__OWNER_SLICE_INVENTORY_UNVERIFIED__"]' > /tmp/active-owner-slices.json
            echo "true" > /tmp/owner-inventory-blocked
          else
            echo '[]' > /tmp/active-owner-slices.json
          fi

      - name: Compute one safe queue-consumer tick (no GitHub writes)
        id: tick
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/owner-inventory-blocked ]]; then
            echo "::error::OWNER_SLICE_INVENTORY_UNVERIFIED; refusing to dispatch"
            exit 1
          fi
          echo '{"copilot":"available"}' > /tmp/worker-state.json
          BASE_SHA="$(git rev-parse HEAD)"
          # Exit 1 is the adapter's documented no-dispatch outcome.
          # Any other nonzero exit or missing/invalid packet is an actual failure.
          rc=0
          python -m scripts.queue_auto_promotion_consumer \
            --issues /tmp/issues.json \
            --worker-state /tmp/worker-state.json \
            --active-owner-slices /tmp/active-owner-slices.json \
            --active-paths /tmp/active-paths.json \
            --base-sha "$BASE_SHA" \
            --output /tmp/packet.json || rc=$?
          if [[ "$rc" -gt 1 ]]; then
            echo "::error::QUEUE_CONSUMER_FAILED exit_code=$rc"
            exit "$rc"
          fi
          if [[ ! -s /tmp/packet.json ]] || ! jq -e 'type == "object" and (.status | type == "string")' /tmp/packet.json >/dev/null; then
            echo "::error::QUEUE_CONSUMER_INVALID_PACKET"
            exit 1
          fi
          status="$(jq -r '.status' /tmp/packet.json)"
          if [[ "$rc" == 0 && "$status" != "DISPATCH_READY" ]] || [[ "$rc" == 1 && "$status" == "DISPATCH_READY" ]]; then
            echo "::error::QUEUE_CONSUMER_EXIT_STATUS_MISMATCH rc=$rc status=$status"
            exit 1
          fi
          echo "Queue preflight: candidate_count=${{ steps.scan.outputs.candidate_count }} status=$status"
          jq -c '{status, metrics, selected_issue: (.selected.issue_number // null)}' /tmp/packet.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Queue consumer tick status: $status"
          if [[ "$status" == "DISPATCH_READY" ]]; then
            echo "issue_number=$(jq -r '.selected.issue_number' /tmp/packet.json)" >> "$GITHUB_OUTPUT"
            echo "lease_id=$(jq -r '.dispatch.workflow_dispatch.inputs.lease_id' /tmp/packet.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Post canonical lease evidence and invoke AI Production Dispatch
        if: steps.tick.outputs.status == 'DISPATCH_READY'
        env:
          ISSUE_NUMBER: ${{ steps.tick.outputs.issue_number }}
          LEASE_ID: ${{ steps.tick.outputs.lease_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo INVALID_ISSUE_NUMBER; exit 78; }
          [[ "$ISSUE_NUMBER" != "79" ]] || { echo PROTECTED_ISSUE_79; exit 79; }
          [[ "$LEASE_ID" =~ ^lease-[0-9a-f]{32}$ ]] || { echo INVALID_LEASE_ID; exit 78; }
          {
            jq -r '.dispatch.evidence_comment' /tmp/packet.json
            echo
            echo
            echo "担当: 🌊ナギ"
            echo "種別: Autonomous Queue Consumer / Canonical Lease Evidence"
            echo
            echo "Bounded safe-selection tick (Issue #556) selected this Issue for the existing canonical AI Production Dispatch. Fail-closed duplicate/lease/path/authority checks remain authoritative downstream."
          } > /tmp/evidence-comment.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -F body=@/tmp/evidence-comment.md >/dev/null
          gh workflow run ai-production-dispatch.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$ISSUE_NUMBER" -f lease_id="$LEASE_ID"

      - name: No safe candidate this tick
        if: steps.tick.outputs.status != 'DISPATCH_READY'
        shell: bash
        run: |
          echo "Queue consumer tick result: ${{ steps.tick.outputs.status }}. No executor dispatch this tick (fail-closed)."
