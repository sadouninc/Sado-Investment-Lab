name: Copilot PoC1 — safe implementation lane

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "READY_FOR_IMPLEMENTATION Issue number (Issue #79 is forbidden)"
        required: true
        type: number

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: copilot-poc1-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  safe-implementation-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail closed for protected Issue #79
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ github.event.inputs.issue_number }}'
          issue="${issue%%.*}"
          if [[ "$issue" == "79" ]]; then
            echo "## BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Issue #79 is protected by TEAM_RULES / autonomy policy." >> "$GITHUB_STEP_SUMMARY"
            exit 79
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch Issue contract (read only)
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${ISSUE_NUMBER%%.*}"
          echo "ISSUE_NUMBER=${ISSUE_NUMBER}" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/issue.json

      - name: Validate Contract v1 before worker execution
        id: contract-preflight
        shell: bash
        run: |
          set +e
          python -m scripts.work_contract_consumer_preflight \
            --issue-json /tmp/issue.json \
            --diagnostic-output /tmp/work-contract-preflight.json \
            --contract-output /tmp/issue-contract.md \
            --allowed-paths-output /tmp/issue-allowed-paths.txt \
            --forbidden-paths-output /tmp/issue-forbidden-paths.txt
          rc=$?
          set -e

          echo "## Contract Consumer Preflight" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/work-contract-preflight.json >> "$GITHUB_STEP_SUMMARY"
          if [[ $rc -ne 0 ]]; then
            echo "HARNESS_OUTCOME=BLOCKED_CONTRACT_PREFLIGHT" >> "$GITHUB_ENV"
            exit "$rc"
          fi
          echo "CONTRACT_PREFLIGHT_OUTCOME=ELIGIBLE" >> "$GITHUB_ENV"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Install harness test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Run one non-interactive Copilot implementation pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/poc-prompt.md <<'EOF'
          You are the implementation worker for Sado Investment Lab PoC1.1.

          Read TEAM_RULES.md and /tmp/issue-contract.md before changing anything.
          Work only inside the target Issue Acceptance Criteria and any work_contract allowed_paths / forbidden_paths.

          AUTONOMY / SAFETY CONTRACT:
          - Allowed: repository read/search, worktree file edits, existing tests/lint/build, git status/diff/log.
          - Forbidden: git commit/push, PR/Issue writes, merge/close, workflow self-modification, dependency changes,
            destructive delete/history rewrite, secrets/permissions/billing changes, canonical investment truth inference,
            BUY/SELL/HOLD authority decisions, and any change related to Issue #79.
          - Do not ask questions. If the AC cannot be safely completed inside these boundaries, stop and write BLOCKED plus the exact reason.
          - Do not broaden scope to make the task pass.
          - Do not create or export a session transcript.
          - The Harness is the final validation authority. You may run allowed validation commands, but do not invent successful validation if a command was denied or not executed.
          - REVIEW_READY means you prepared an implementation diff that you believe satisfies the contract; the Harness will independently validate it.
          - If the requested implementation already exists and no repository diff is necessary, report BLOCKED with reason ALREADY_IMPLEMENTED_OR_NO_DIFF.

          Complete one implementation pass. Then write /tmp/copilot-result.md as plain text with these exact field names and no Markdown decoration:
          outcome: REVIEW_READY or BLOCKED
          changed_files: comma-separated list
          validation: concise commands/results, or DEFERRED_TO_HARNESS
          blocked_reason: reason or NONE
          confirmation_count: 0
          EOF

          copilot -p "$(cat /tmp/poc-prompt.md; printf '\n\n'; cat /tmp/issue-contract.md)" \
            --no-ask-user \
            --allow-tool='write' \
            --allow-tool='shell(git status)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(python -m pytest:*)' \
            --allow-tool='shell(python3 -m pytest:*)' \
            --allow-tool='shell(pytest:*)' \
            --allow-tool='shell(python -m py_compile:*)' \
            --allow-tool='shell(python3 -m py_compile:*)' \
            --deny-tool='shell(git commit:*)' \
            --deny-tool='shell(git push:*)' \
            --deny-tool='shell(gh:*)'

      - name: Harness validation
        id: harness
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t untracked < <(git ls-files --others --exclude-standard)
          if (( ${#untracked[@]} )); then
            git add -N -- "${untracked[@]}"
          fi

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo "HARNESS_OUTCOME=BLOCKED_NO_REPO_DIFF" >> "$GITHUB_ENV"
            exit 87
          fi
          printf '%s\n' "$changed" > /tmp/changed-paths.txt

          generic_forbidden="$(printf '%s\n' "$changed" | grep -E '(^\.github/workflows/|(^|/)(package(-lock)?\.json|pyproject\.toml|requirements[^/]*\.txt|poetry\.lock|uv\.lock)$)' || true)"
          if [[ -n "$generic_forbidden" ]]; then
            echo "HARNESS_OUTCOME=BLOCKED_FORBIDDEN_PATH" >> "$GITHUB_ENV"
            printf '%s\n' "$generic_forbidden" > /tmp/forbidden-paths.txt
            exit 86
          fi

          set +e
          python - <<'PY'
          import fnmatch
          from pathlib import Path

          changed = [p for p in Path('/tmp/changed-paths.txt').read_text().splitlines() if p]
          allowed = [p for p in Path('/tmp/issue-allowed-paths.txt').read_text().splitlines() if p]
          forbidden = [p for p in Path('/tmp/issue-forbidden-paths.txt').read_text().splitlines() if p]

          violations = []
          for path in changed:
              if allowed and not any(fnmatch.fnmatch(path, pattern) for pattern in allowed):
                  violations.append(f'OUTSIDE_ALLOWED_PATHS {path}')
              if any(fnmatch.fnmatch(path, pattern) for pattern in forbidden):
                  violations.append(f'ISSUE_FORBIDDEN_PATH {path}')

          if violations:
              Path('/tmp/forbidden-paths.txt').write_text('\n'.join(violations) + '\n')
              raise SystemExit(85)
          PY
          rc=$?
          set -e
          if [[ $rc -eq 85 ]]; then
            echo "HARNESS_OUTCOME=BLOCKED_ISSUE_PATH_CONTRACT" >> "$GITHUB_ENV"
            exit 85
          elif [[ $rc -ne 0 ]]; then
            exit "$rc"
          fi

          if [[ ! -f /tmp/copilot-result.md ]]; then
            echo "HARNESS_OUTCOME=BLOCKED_RESULT_MISSING" >> "$GITHUB_ENV"
            exit 88
          fi

          # Be tolerant of accidental Markdown decoration such as **outcome:**,
          # while keeping REVIEW_READY as an explicit agent declaration.
          if ! grep -Eq '^\*{0,2}outcome:\*{0,2}[[:space:]]*REVIEW_READY[[:space:]]*$' /tmp/copilot-result.md; then
            echo "HARNESS_OUTCOME=BLOCKED_AGENT_NOT_REVIEW_READY" >> "$GITHUB_ENV"
            exit 89
          fi

          if git diff --name-only -- '*.py' | grep -q .; then
            mapfile -t pyfiles < <(git diff --name-only --diff-filter=ACMRT -- '*.py')
            if (( ${#pyfiles[@]} )); then
              python -m py_compile "${pyfiles[@]}"
            fi
          fi

          python -m pytest -q
          echo "HARNESS_OUTCOME=REVIEW_READY_VALIDATED" >> "$GITHUB_ENV"

      - name: Validate safety boundary and summarize
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          echo "## Copilot PoC1.1 — Issue #${ISSUE_NUMBER:-${{ github.event.inputs.issue_number }}}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Harness outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "${HARNESS_OUTCOME:-BLOCKED_BEFORE_HARNESS_COMPLETE}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Working tree" >> "$GITHUB_STEP_SUMMARY"
          git status --short >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Diff stat" >> "$GITHUB_STEP_SUMMARY"
          git diff --stat >> "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f /tmp/copilot-result.md ]]; then
            echo "### Agent result" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/copilot-result.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Agent result" >> "$GITHUB_STEP_SUMMARY"
            echo "BLOCKED: Copilot did not produce the required result contract." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f /tmp/forbidden-paths.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### SAFETY BLOCK" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/forbidden-paths.txt >> "$GITHUB_STEP_SUMMARY"
          fi

          git diff --binary > /tmp/copilot.patch || true

      - name: Upload review patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-poc1-${{ env.ISSUE_NUMBER || github.event.inputs.issue_number }}-patch
          path: /tmp/copilot.patch
          if-no-files-found: ignore
          retention-days: 3
