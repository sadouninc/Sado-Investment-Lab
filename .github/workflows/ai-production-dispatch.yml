name: AI Production Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-production-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Require exact normalized owner command
        id: command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$normalized" == '/ai copilot' ]]; then
            echo "accepted=true" >> "$GITHUB_OUTPUT"
            echo COMMAND_EXACT_ACCEPTED
          else
            echo "accepted=false" >> "$GITHUB_OUTPUT"
            echo COMMAND_NOT_EXACT_SKIP
          fi

      - name: Fail closed and validate READY issue
        id: gate
        if: steps.command.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          issue="${ISSUE_NUMBER%%.*}"
          if [[ "$issue" == "79" ]]; then
            echo PROTECTED_ISSUE_79
            exit 79
          fi

          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" > /tmp/issue.json
          jq -e '.labels | map(.name) | index("READY_FOR_IMPLEMENTATION") != null' /tmp/issue.json >/dev/null || {
            echo ISSUE_NOT_READY
            exit 78
          }

          : > /tmp/comment-pages.jsonl
          page=1
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments?per_page=100&page=${page}" > /tmp/comment-page.json
            jq -c '.' /tmp/comment-page.json >> /tmp/comment-pages.jsonl
            count="$(jq 'length' /tmp/comment-page.json)"
            [[ "$count" == "100" ]] || break
            page=$((page + 1))
          done
          jq -s 'add // []' /tmp/comment-pages.jsonl > /tmp/comments.json

          python - <<'PY'
          import json, os, re
          issue = int(os.environ['ISSUE_NUMBER'])
          comments = json.load(open('/tmp/comments.json'))
          leases = []
          for comment in comments:
              body = comment.get('body') or ''
              for raw in re.findall(r'\{[^\n]*"work_ref"\s*:\s*"issue:%d"[^\n]*\}' % issue, body):
                  try:
                      lease = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if lease.get('owner_slice') == f'issue-{issue}':
                      leases.append(lease)
          if leases and leases[-1].get('status') in {'ASSIGNED','ACKNOWLEDGED','FALLBACK_ASSIGNED'}:
              raise SystemExit('DUPLICATE_ACTIVE_DISPATCH')
          PY

          assigned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d '+60 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          lease="$(jq -nc \
            --arg work_ref "issue:${issue}" \
            --arg owner_slice "issue-${issue}" \
            --arg assigned_at "$assigned_at" \
            --arg expires_at "$expires_at" \
            '{work_ref:$work_ref,owner_slice:$owner_slice,engine:"copilot",assigned_at:$assigned_at,acknowledged_at:null,lease_expires_at:$expires_at,fallback_owner:"amazon_q_free",status:"ASSIGNED"}')"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="<!-- flow-dispatch-lease -->
          ${lease}

          担当: ♦️ソラ
          種別: AI Production Dispatch / Copilot Lease

          Owner-authenticated /ai copilot accepted. Copilot safe lane dispatched with 60m lease. Contract/safety failure remains fail-closed." >/dev/null

          echo "issue_number=$issue" >> "$GITHUB_OUTPUT"

      - name: Dispatch Copilot and explicitly hand off completion
        if: steps.command.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
        shell: bash
        run: |
          set -euo pipefail
          request_started="$(date -u -d '-2 seconds' +%Y-%m-%dT%H:%M:%SZ)"
          source_title="Copilot PoC1 — issue ${ISSUE_NUMBER}"

          gh workflow run copilot-poc1.yml --repo "$GITHUB_REPOSITORY" --ref main -f issue_number="$ISSUE_NUMBER"

          source_run_id=""
          for _ in {1..60}; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/copilot-poc1.yml/runs?event=workflow_dispatch&per_page=30" > /tmp/copilot-runs.json
            source_run_id="$(jq -r \
              --arg title "$source_title" \
              --arg started "$request_started" \
              '[.workflow_runs[] | select(.display_title == $title and .created_at >= $started)] | sort_by(.created_at) | last | .id // empty' \
              /tmp/copilot-runs.json)"
            [[ -n "$source_run_id" ]] && break
            sleep 2
          done
          if [[ -z "$source_run_id" ]]; then
            echo COPILOT_SOURCE_RUN_NOT_FOUND
            exit 76
          fi

          set +e
          gh run watch "$source_run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          watch_rc=$?
          set -e
          source_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" --jq '.conclusion // "unknown"')"
          echo "Copilot source run ${source_run_id} completed: ${source_conclusion} (watch_rc=${watch_rc})"

          gh workflow run ai-production-followup.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f issue_number="$ISSUE_NUMBER" \
            -f source_run_id="$source_run_id" \
            -f source_conclusion="$source_conclusion"
