name: Publish Sado Investment Lab

on:
  push:
    branches:
      - main
    paths:
      - "00_Framework/**"
      - "01_Portfolio/Transactions/**"
      - "02_Themes/**"
      - "03_Companies/**"
      - "04_Market/**"
      - "05_Daily_Reports/**"
      - "06_Research/Architecture/**"
      - "06_Research/News/**"
      - "data/market/**"
      - "data/masters/**"
      - "data/config/**"
      - "data/generated/public/trade-analysis-summary.json"
      - "data/generated/public/money-flow/**"
      - "data/generated/diagnostics/openai/**"
      - "08_Trade_Analysis/**"
      - "scripts/**"
      - "tests/**"
      - "database/migrations/**"
      - "assets/images/**"
      - ".github/pages/**"
      - ".github/workflows/publish-site.yml"
      - ".github/workflows/update-market-phase.yml"
      - ".github/workflows/ai-morning-analyst.yml"
  pull_request:
    paths:
      - "00_Framework/**"
      - "01_Portfolio/Transactions/**"
      - "02_Themes/**"
      - "03_Companies/**"
      - "04_Market/**"
      - "05_Daily_Reports/**"
      - "06_Research/Architecture/**"
      - "06_Research/News/**"
      - "data/market/**"
      - "data/masters/**"
      - "data/config/**"
      - "data/generated/public/trade-analysis-summary.json"
      - "data/generated/diagnostics/openai/**"
      - "08_Trade_Analysis/**"
      - "scripts/**"
      - "tests/**"
      - "database/migrations/**"
      - "assets/images/**"
      - ".github/pages/**"
      - ".github/workflows/publish-site.yml"
      - ".github/workflows/update-market-phase.yml"
      - ".github/workflows/ai-morning-analyst.yml"
  schedule:
    # 23:40 UTC Sunday-Thursday = 08:40 JST Monday-Friday.
    - cron: "40 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest run for the same publication lane. Pull-request validation
# is isolated from main publication so a slow PR cannot block the production site.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.1

      - name: Generate market phase report
        run: python3 -m scripts.market_phase.pipeline

      - name: Generate Investor DNA v2 report
        run: python3 scripts/investor_dna_v2.py

      # Morning Dataset is generated by ai-morning-analyst.yml with the full canonical contract.
      # Pages publish must NOT regenerate with a reduced provider set, as that would replace
      # OK sources with MISSING. The canonical file is already committed to the repo.
      # Issue #334 Pages regression fix.
      - name: Verify Morning Dataset exists
        run: |
          test -f data/generated/public/morning-dataset.json || \
            echo "Warning: morning-dataset.json not found, Pages will use fallback"

      - name: Test Trade Journal mapping
        run: python3 -m unittest discover -s .github/pages -p "test_*.py"

      - name: Test analysis pipelines
        run: python3 -m pytest tests -q

      - name: Prepare site
        run: python3 .github/pages/build_site.py

      - name: Publish Concept guides
        run: python3 .github/pages/concept.py

      - name: Publish Daihen decision cockpit
        run: PYTHONPATH=.github/pages python3 .github/pages/build_daihen_cockpit.py

      - name: Publish risk preflight confirmation
        run: python3 .github/pages/build_risk_preflight.py

      - name: Publish architecture docs
        run: python3 .github/pages/build_architecture.py

      - name: Publish Investor DNA
        run: python3 .github/pages/build_investor_dna.py

      - name: Publish Morning Dataset diagnostics
        run: python3 .github/pages/build_morning_dataset.py

      - name: Publish AI Morning Reports
        run: python3 .github/pages/build_ai_morning_reports.py

      - name: Verify generated routes
        shell: bash
        run: |
          set -euo pipefail
          test -f site-src/index.md
          test -f site-src/framework/index.md
          test -f site-src/themes/index.md
          test -f site-src/companies/index.md
          test -f site-src/market-analysis/index.md
          test -f site-src/market-analysis/2026/2026-08-05/index.md
          test -f site-src/research/market-phase/ai-semiconductor/index.md
          test -f site-src/research/investor-dna/index.md
          test -f site-src/research/morning-dataset/index.md
          test -f site-src/research/morning-dataset/morning-dataset.json
          test -f site-src/research/ai-key-person-watch/index.md
          test -f site-src/research/ai-key-person-watch/2026/2026-08/index.md
          test -f site-src/reports/morning/index.md
          test -f data/generated/public/morning-dataset.json
          test -f site-src/architecture/index.md
          test -f site-src/architecture/investment-decision-os-data-model/index.md
          test -f site-src/concepts/investment-decision-cockpit/index.md
          test -f site-src/decision-cockpit/daihen/index.md
          test -f site-src/risk-preflight/index.md
          test -f site-src/trade-journal/index.md
          test -f site-src/trade-analysis/index.md
          test -f site-src/trade-journal/2026/08/2026-08-03/index.md
          test -f site-src/trade-journal/2026/08/2026-08-04/index.md
          test -f site-src/trade-journal/2026/08/2026-08-05/index.md
          test -f site-src/companies/semiconductor/4063-shinetsu/index.md
          test -f site-src/companies/semiconductor/3110-nittobo/index.md
          grep -q "4063-shinetsu" site-src/companies/index.md
          grep -q "3110-nittobo" site-src/companies/index.md
          grep -q "2026-08-05" site-src/market-analysis/index.md
          grep -q "Sado Market Phase Analyzer" site-src/research/market-phase/ai-semiconductor/index.md
          grep -q "phase-data" site-src/research/market-phase/ai-semiconductor/index.md
          grep -q "Investor DNA Engine" site-src/research/investor-dna/index.md
          grep -q "Native DNA" site-src/research/investor-dna/index.md
          grep -q "Current Environment Fit" site-src/research/investor-dna/index.md
          grep -q "Lifetime Profit Contribution" site-src/research/investor-dna/index.md
          grep -q "Morning Dataset Diagnostics" site-src/research/morning-dataset/index.md
          grep -q '"schema_version": "1.0"' site-src/research/morning-dataset/morning-dataset.json
          grep -q "AI Morning Reports" site-src/reports/morning/index.md
          grep -q "AI Morning Reports" site-src/index.md
          grep -q "Investor DNA" site-src/index.md
          grep -q "Morning Dataset" site-src/index.md
          grep -q "AI Key Person Watch" site-src/index.md
          grep -q "売買前のポートフォリオ確認" site-src/index.md
          grep -q "Sado Investment Codex / 5 判断" site-src/concepts/investment-decision-cockpit/index.md
          grep -q "Warning・Thesis Health" site-src/concepts/investment-decision-cockpit/index.md
          grep -q "前回から何が変わった？" site-src/decision-cockpit/daihen/index.md
          grep -q "Scenario: UNKNOWN" site-src/decision-cockpit/daihen/index.md
          grep -q "BLOCK_REVIEW" site-src/risk-preflight/index.md
          grep -q "Decision Journal" site-src/risk-preflight/index.md
          grep -q "これは売買指示ではありません" site-src/risk-preflight/index.md
          grep -q "孫正義" site-src/research/ai-key-person-watch/index.md
          grep -q "何が変わったか" site-src/research/ai-key-person-watch/index.md
          grep -q "2026-08" site-src/research/ai-key-person-watch/index.md
          grep -q "Investment Decision OS Data Model" site-src/architecture/index.md
          grep -q "FACT / OBSERVATION" site-src/architecture/investment-decision-os-data-model/index.md
          grep -q "Architecture" site-src/index.md
          test -f assets/images/market-analysis/2026/nikkei-daily-decline-factors-2026-08-05.jpg
          grep -q "data:image/jpeg;base64," site-src/market-analysis/2026/2026-08-05/index.md
          grep -q "2026-08-03" site-src/trade-journal/index.md
          grep -q "2026-08-04" site-src/trade-journal/index.md
          grep -q "全期間の実取引データ" site-src/trade-analysis/index.md
          grep -q 'id="ta-symbol"' site-src/trade-analysis/index.md
          grep -q 'id="ta-theme"' site-src/trade-analysis/index.md
          grep -q "trade-analysis-data" site-src/trade-analysis/index.md
          grep -q "データ品質" site-src/trade-analysis/index.md
          grep -q '"security_name"' site-src/trade-analysis/index.md
          grep -q '"net_pnl"' site-src/trade-analysis/index.md
          ! grep -Eq '"(episode_key|account|first_execution_id|final_execution_id)"' site-src/trade-analysis/index.md
          test -f site-src/assets/trade-analysis.js
          grep -q "2026-08-05" site-src/trade-journal/index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site-src
          destination: ./_site

      - name: Verify published routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q "data:image/jpeg;base64," \
            _site/market-analysis/2026/2026-08-05/index.html
          test -f _site/architecture/index.html
          test -f _site/architecture/investment-decision-os-data-model/index.html
          test -f _site/concepts/investment-decision-cockpit/index.html
          grep -q "Sado Investment Codex / 5 判断" _site/concepts/investment-decision-cockpit/index.html
          grep -q "Warning・Thesis Health" _site/concepts/investment-decision-cockpit/index.html
          test -f _site/decision-cockpit/daihen/index.html
          grep -q "前回から何が変わった？" _site/decision-cockpit/daihen/index.html
          grep -q "Scenario: UNKNOWN" _site/decision-cockpit/daihen/index.html
          test -f _site/risk-preflight/index.html
          grep -q "売買前のポートフォリオ確認" _site/risk-preflight/index.html
          test -f _site/research/investor-dna/index.html
          grep -q "Investor DNA Engine" _site/research/investor-dna/index.html
          grep -q "Current Environment Fit" _site/research/investor-dna/index.html
          test -f _site/research/morning-dataset/index.html
          test -f _site/research/morning-dataset/morning-dataset.json
          grep -q "Morning Dataset Diagnostics" _site/research/morning-dataset/index.html
          grep -q '"schema_version": "1.0"' _site/research/morning-dataset/morning-dataset.json
          test -f _site/reports/morning/index.html
          test -f _site/research/ai-key-person-watch/index.html
          test -f _site/research/ai-key-person-watch/2026/2026-08/index.html
          grep -q "AI Key Person Watch" _site/research/ai-key-person-watch/index.html
          grep -q "AI Morning Reports" _site/reports/morning/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  preview:
    name: pages-preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout preview tooling
        uses: actions/checkout@v6

      - name: Download built Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: preview-artifact

      - name: Prepare isolated preview
        id: prepare
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir preview-site
          tar -xf preview-artifact/artifact.tar -C preview-site
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 .github/pages/prepare_pr_preview.py \
            --root preview-site \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --namespace "pr-${PR_NUMBER}" \
            --pr-number "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --built-at "${built_at}"

      - name: Publish preview namespace
        id: publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages-previews
          publish_dir: preview-site
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: >-
            preview: PR #${{ github.event.pull_request.number }}
            at ${{ github.event.pull_request.head.sha }}

      - name: Resolve immutable preview URL
        id: url
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          preview_ref="$(git ls-remote origin refs/heads/pages-previews | cut -f1)"
          test -n "${preview_ref}"
          base="https://raw.githack.com/${GITHUB_REPOSITORY}/${preview_ref}/pr-${PR_NUMBER}"
          echo "preview_ref=${preview_ref}" >> "${GITHUB_OUTPUT}"
          echo "root=${base}/index.html" >> "${GITHUB_OUTPUT}"
          echo "cockpit=${base}/concepts/investment-decision-cockpit/index.html" >> "${GITHUB_OUTPUT}"
          echo "metadata=${base}/preview-metadata.json" >> "${GITHUB_OUTPUT}"

      - name: Verify browser preview
        id: verify
        shell: bash
        env:
          ROOT_URL: ${{ steps.url.outputs.root }}
          COCKPIT_URL: ${{ steps.url.outputs.cockpit }}
          METADATA_URL: ${{ steps.url.outputs.metadata }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${ROOT_URL}" -o preview-root.html
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${COCKPIT_URL}" -o preview-cockpit.html
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 "${METADATA_URL}" -o preview-metadata.json
          grep -q "PR PREVIEW" preview-root.html
          grep -q "NOT PRODUCTION" preview-root.html
          grep -q "Sado Investment Codex" preview-cockpit.html
          grep -q "${HEAD_SHA}" preview-metadata.json

      - name: Record preview result
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.url.outputs.root }}
          COCKPIT_URL: ${{ steps.url.outputs.cockpit }}
          PREVIEW_REF: ${{ steps.url.outputs.preview_ref }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- sado-pages-preview -->';
            const ready = process.env.VERIFY_OUTCOME === 'success';
            const status = ready ? '✅ READY' : '❌ FAILED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const urls = ready
              ? `\n- [Open preview](${process.env.PREVIEW_URL})\n- [Open Investment Decision Cockpit](${process.env.COCKPIT_URL})`
              : `\n- [Inspect Pages preview job](${runUrl})`;
            const body = `${marker}\n## PR Pages Preview — ${status}\n\n` +
              `- PR: #${context.issue.number}\n` +
              `- Source head: \`${process.env.HEAD_SHA}\`\n` +
              `- Preview artifact commit: \`${process.env.PREVIEW_REF || 'not published'}\`\n` +
              `- Environment: **NOT PRODUCTION**${urls}\n\n` +
              `担当: 🤖カイ  \n種別: Implementation / Reliability / Pages Preview`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
            await core.summary
              .addHeading(`PR Pages Preview — ${status}`)
              .addRaw(`Source head: ${process.env.HEAD_SHA}\n\n`)
              .addRaw(ready ? `Preview: ${process.env.PREVIEW_URL}\n` : `Run: ${runUrl}\n`)
              .write();

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
