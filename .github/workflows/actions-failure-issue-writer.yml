name: Actions Failure Issue Writer (#873)

on:
  # Read-only observation once daily; schedule never enables issue POST.
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      confirm_issue_post:
        description: 'Exact confirmation to create at most one TRIAGE issue; leave empty for dry-run'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: actions-failure-issue-writer-873
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm_issue_post != 'ISSUE873_CREATE_ONE'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate and optionally create one TRIAGE issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          ISSUE_POST_CONFIRM: ${{ inputs.confirm_issue_post }}
        run: |
          set +e
          PYTHONPATH=. python -m scripts.actions_failure_issue_orchestrator > issue-writer-result.json
          rc=$?
          set -e
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path("issue-writer-result.json")
          try:
              data = json.loads(path.read_text()) if path.exists() else {"decision": "HOLD_MISSING_OUTPUT"}
              if not isinstance(data, dict):
                  raise ValueError("invalid shape")
          except (OSError, ValueError):
              data = {"decision": "HOLD_INVALID_OUTPUT"}
          safe = lambda v: re.sub(r"[^A-Za-z0-9_ .-]", "_", str(v))[:120]
          print("Issue #873 writer result (sanitized)")
          for key in ("decision", "issue_post", "error_type"):
              if key in data:
                  print(f"{key}={safe(data[key])}")
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as out:
              out.write("## Issue #873 writer result\n\n")
              for key in ("decision", "issue_post", "issue_number", "error_type"):
                  if key in data:
                      out.write(f"- {key}: {safe(data[key])}\n")
              out.write("- READY dispatch: disabled\n")
          PY
          exit "$rc"
  writer:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_issue_post == 'ISSUE873_CREATE_ONE'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create at most one TRIAGE issue with explicit confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          ISSUE_POST_CONFIRM: ${{ inputs.confirm_issue_post }}
        run: |
          set +e
          PYTHONPATH=. python -m scripts.actions_failure_issue_orchestrator --enable-post > issue-writer-result.json
          rc=$?
          set -e
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          try:
              result = json.loads(Path("issue-writer-result.json").read_text())
              if not isinstance(result, dict):
                  raise ValueError("invalid shape")
          except (OSError, ValueError):
              result = {"decision": "HOLD_INVALID_OUTPUT"}
          safe = lambda v: re.sub(r"[^A-Za-z0-9_ .-]", "_", str(v))[:120]
          print("Issue #873 gated POST result (sanitized)")
          for key in ("decision", "error_type"):
              if key in result:
                  print(f"{key}={safe(result[key])}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Issue #873 gated POST result\n\n")
              for key in ("decision", "issue_number", "error_type"):
                  if key in result:
                      out.write(f"- {key}: {safe(result[key])}\n")
              out.write("- READY dispatch: disabled\n")
          PY
          exit "$rc"
