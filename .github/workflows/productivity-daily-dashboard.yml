name: Productivity Daily Dashboard

on:
  schedule:
    # 14:55 UTC = 23:55 JST. Capture an almost-complete JST day.
    - cron: "55 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run dashboard tests
        run: python3 -m unittest tests.test_productivity_daily_dashboard -v

      - name: Collect and publish 14-day dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/productivity_daily_dashboard.py \
            --repo "${GITHUB_REPOSITORY}" \
            --issue 479 \
            --days 14 \
            --output-json /tmp/productivity-daily.json \
            --output-markdown /tmp/productivity-daily.md \
            --publish-comment

      - name: Upload audit snapshot
        uses: actions/upload-artifact@v4
        with:
          name: productivity-daily-dashboard
          path: |
            /tmp/productivity-daily.json
            /tmp/productivity-daily.md
          retention-days: 30
