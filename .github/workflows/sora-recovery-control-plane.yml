name: Sora Recovery Control Plane

# Issue #859: GitHub-side durable recovery ingress for Sora.
# ChatGPT scheduled roles are non-writers by default. This workflow persists
# a bounded SORA lease so Sora can discover recovery work by reading GitHub.
# It never merges and Issue #79 is hard denied.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Recovery issue number
        required: true
        type: string
      lease_id:
        description: Canonical recovery lease id
        required: true
        type: string
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: sora-recovery-control-plane
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve explicit or pull-discovered recovery target
        id: target
        shell: bash
        env:
          INPUT_ISSUE: ${{ inputs.issue_number }}
          INPUT_LEASE: ${{ inputs.lease_id }}
        run: |
          set -euo pipefail
          issue="${INPUT_ISSUE:-}"
          lease="${INPUT_LEASE:-}"
          source="workflow_dispatch"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            source="scheduled_pull"
            # Pull fallback: bounded open-issue scan. Recovery contracts are
            # deliberately explicit in title/body; newest P0/P1 contract wins.
            # Fetch every page, not only the latest 30 updated issues.
            # A busy repository must not starve an older P0 recovery contract.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100&sort=updated&direction=desc" | jq -s 'add // []' > /tmp/issues.json
            issue="$(jq -r '[.[] | select((.pull_request // null) == null and .number != 79) | select((.body // "") | test("(?m)^## Recovery Work Contract[^\\n]*$") and test("(?m)^\\*\\*Priority:\\*\\* P[01]\\b") and test("(?m)^\\*\\*Flow Authority:\\*\\* .*ルナ") and test("(?m)^\\*\\*Recovery Engineer:\\*\\* .*ソラ"))] | sort_by((if (.body | test("(?m)^\\*\\*Priority:\\*\\* P0\\b")) then 0 else 1 end), .number) | first | .number // empty' /tmp/issues.json)"
            [[ -n "$issue" ]] || { echo NO_RECOVERY_TARGET; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; }
            lease="lease-$(printf '%s' "sora-recovery:${issue}:$(date -u +%Y-%m-%dT%H)" | sha256sum | cut -c1-32)"
          fi

          [[ "$issue" =~ ^[1-9][0-9]*$ ]] || { echo INVALID_ISSUE_NUMBER; exit 78; }
          [[ "$issue" != "79" ]] || { echo PROTECTED_ISSUE_79; exit 79; }
          [[ "$lease" =~ ^lease-[0-9a-f]{32}$ ]] || { echo INVALID_LEASE_ID; exit 78; }
          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}" >/tmp/issue.json
          jq -e '.state == "open" and (.pull_request == null) and ((.body // "") | test("(?m)^## Recovery Work Contract[^\\n]*$") and test("(?m)^\\*\\*Priority:\\*\\* P[01]\\b") and test("(?m)^\\*\\*Flow Authority:\\*\\* .*ルナ") and test("(?m)^\\*\\*Recovery Engineer:\\*\\* .*ソラ"))' /tmp/issue.json >/dev/null || { echo INVALID_RECOVERY_CONTRACT; exit 78; }

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "lease=$lease" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: Checkout read-only guard implementation
        if: steps.target.outputs.found == 'true'
        uses: actions/checkout@v4

      # The guard is a hold-only preflight. It cannot grant dispatch authority.
      # Every comment and PR page must be available before considering a write.
      - name: Read-only candidate guard before issue-comment POST
        id: guard
        if: steps.target.outputs.found == 'true'
        shell: bash
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" | jq -s 'add // []' > /tmp/comments.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=all&per_page=100" | jq -s 'add // []' > /tmp/prs.json
          # A preliminary pass never authorizes a mutation. Hold the POST
          # without turning expected safety holds into workflow failures.
          guard_rc=0
          python -m scripts.sora_recovery_candidate_guard \
            --issue-json /tmp/issue.json \
            --comments-json /tmp/comments.json \
            --prs-json /tmp/prs.json || guard_rc=$?
          if [[ "$guard_rc" == "0" ]]; then
            echo CANDIDATE_PREFLIGHT_ONLY
          elif [[ "$guard_rc" == "78" ]]; then
            echo CANDIDATE_GUARD_HOLD
          else
            echo "CANDIDATE_GUARD_EXECUTION_ERROR rc=$guard_rc" >&2
            exit "$guard_rc"
          fi
          # Project the complete candidate evidence through the Rev.2 reader.
          # No comment-to-Actions-run attestation is established here, so
          # provenance_verified MUST remain false. The reader cannot authorize
          # a POST; this is an observable, fail-closed integration checkpoint.
          python - <<'PY'
          import json
          from scripts.recovery_rev2_read_bridge import project_attested_comments
          with open("/tmp/comments.json", encoding="utf-8") as f:
              comments = json.load(f)
          with open("/tmp/issue.json", encoding="utf-8") as f:
              issue = json.load(f)
          result = project_attested_comments(
              work_id=f"issue:{issue['number']}",
              comments=comments,
              trusted_comment_ids=set(),
              provenance_verified=False,
          )
          print("CANONICAL_READER_PROJECTION=" + json.dumps(result, sort_keys=True))
          assert result["dispatch_allowed"] is False
          PY
          echo CANONICAL_READER_AND_OWNER_AUTHORITY_NOT_WIRED
          echo "post_authorized=false" >> "$GITHUB_OUTPUT"

      - name: Persist idempotent SORA recovery lease
        if: steps.target.outputs.found == 'true' && steps.guard.outputs.post_authorized == 'true'
        env:
          ISSUE: ${{ steps.target.outputs.issue }}
          LEASE: ${{ steps.target.outputs.lease }}
          SOURCE: ${{ steps.target.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE" != "79" ]] || exit 79
          marker="<!-- AUTO_ROUTER_DISPATCH lease_id=${LEASE} executor=SORA target_issue=${ISSUE} -->"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?per_page=100" | jq -s 'add // []' > /tmp/comments.json
          if jq -e --arg marker "$marker" 'any(.[]; (.body // "") | contains($marker))' /tmp/comments.json >/dev/null; then
            echo SORA_LEASE_ALREADY_PERSISTED
            exit 0
          fi

          # Fail closed on ANY prior SORA dispatch until canonical ACK/PR/terminal
          # reconciliation and retry authority are implemented. Expiry alone
          # is NOT proof that the previous executor stopped. This temporary
          # safety gate intentionally disables automatic redispatch.
          # Do not treat quoted/historical marker mentions as authorization;
          # conservative false positives require manual reconciliation.
          if jq -e --arg issue "$ISSUE" '
            any(.[]; (.body // "") | test("AUTO_ROUTER_DISPATCH") and
              test("executor=SORA") and
              test("target_issue=" + $issue + "([^0-9]|$)"))
          ' /tmp/comments.json >/dev/null; then
            echo PRIOR_SORA_DISPATCH_REQUIRES_CANONICAL_RECONCILIATION
            exit 78
          fi

          assigned="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires="$(date -u -d '+90 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          event="$(jq -nc --arg work_ref "issue:${ISSUE}" --arg lease "$LEASE" --arg assigned "$assigned" --arg expires "$expires" --arg source "$SOURCE" --argjson writer_run_id "$GITHUB_RUN_ID" '{writer_run_id:$writer_run_id,work_ref:$work_ref,owner_slice:("issue-"+($work_ref|split(":")[1])),executor:"SORA",canonical_lease_id:$lease,assigned_at:$assigned,lease_expires_at:$expires,status:"DISPATCHED",source:$source}')"
          body="$(printf '%s\n%s\n\n%s\n%s' "$marker" "$event" '担当: 🌙ルナ / Recovery Control Plane' '種別: External Durable Writer / SORA Recovery Lease')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments" -f body="$body" >/tmp/result.json
          echo "SORA_LEASE_PERSISTED issue=${ISSUE} lease=${LEASE} run_id=${GITHUB_RUN_ID}"

