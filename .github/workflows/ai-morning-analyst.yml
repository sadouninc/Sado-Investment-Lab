name: AI Morning Analyst

on:
  schedule:
    # 23:45 UTC Sunday-Thursday = 08:45 JST Monday-Friday.
    - cron: "45 23 * * 0-4"
    # Recovery run: 00:10 UTC Monday-Friday = 09:10 JST Monday-Friday.
    - cron: "10 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-morning-analyst
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
      OPENAI_INPUT_COST_PER_MILLION: ${{ vars.OPENAI_INPUT_COST_PER_MILLION }}
      OPENAI_OUTPUT_COST_PER_MILLION: ${{ vars.OPENAI_OUTPUT_COST_PER_MILLION }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve Japan business date
        shell: bash
        run: echo "AS_OF_JST=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_ENV"

      - name: Decide whether today's Morning pipeline needs recovery
        id: recovery
        shell: bash
        run: |
          python3 scripts/morning_scheduler_guard.py \
            --as-of "$AS_OF_JST" \
            --github-output "$GITHUB_OUTPUT"

      - name: Generate market phase report
        if: steps.recovery.outputs.should_generate == 'true'
        run: python3 -m scripts.market_phase.pipeline

      - name: Generate Investor DNA v2 report
        if: steps.recovery.outputs.should_generate == 'true'
        run: python3 scripts/investor_dna_v2.py

      - name: Test Morning Dataset providers and event collector
        if: steps.recovery.outputs.should_generate == 'true'
        run: |
          python3 -m unittest \
            tests.test_market_provider \
            tests.test_portfolio_provider \
            tests.test_capital_provider \
            tests.test_candidates_provider \
            tests.test_candidate_selector_provider \
            tests.test_events_provider \
            tests.test_watchlist_provider \
            tests.test_event_calendar_collector

      - name: Generate Candidate Selector snapshot
        if: steps.recovery.outputs.should_generate == 'true'
        run: |
          python3 -m scripts.candidate_selector_sources \
            --as-of "$AS_OF_JST" \
            --output data/generated/public/candidate-selector.json \
            --shortlist data/generated/public/candidate-selector-shortlist.md

      - name: Build canonical event calendar from reviewed inputs
        if: steps.recovery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for category in earnings economic policy market_calendar company; do
            path="data/events/sources/${category}.json"
            if [[ -f "$path" ]]; then
              args+=(--source "${category}=${path}|repository-reviewed-${category}")
            fi
          done
          python3 scripts/event_calendar_collector.py \
            "${args[@]}" \
            --as-of "$AS_OF_JST" \
            --output data/events/calendar.json

      - name: Generate Morning Dataset
        if: steps.recovery.outputs.should_generate == 'true'
        run: |
          python3 scripts/generate_morning_dataset.py \
            --as-of "$AS_OF_JST" \
            --live-market \
            --repo-portfolio \
            --repo-capital \
            --selector-candidates \
            --repo-events \
            --repo-watchlist \
            --repo-sector-rotation \
            --investor-dna data/generated/public/investor-dna.json

      - name: Verify Morning Dataset repository sources are explicit
        if: steps.recovery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/generated/public/morning-dataset.json').read_text())

          market=next(row for row in payload['source_status'] if row['name']=='market')
          assert market['status'] in {'OK','PARTIAL','MISSING'}, market
          if market['status'] != 'MISSING':
              assert payload['market']['indices'], payload['market']
              assert market.get('source_reference'), market
          print('market source:', market['status'], market.get('as_of'), market.get('reason'))

          for name in ('portfolio', 'capital', 'candidates', 'events', 'watchlist', 'sector_rotation'):
              row=next(row for row in payload['source_status'] if row['name']==name)
              assert row['status'] in {'OK','PARTIAL','STALE','MISSING'}, row
              if row['status'] != 'MISSING':
                  assert payload[name] is not None, (name, payload[name])
                  assert row.get('source_reference'), row
              print(f'{name} source:', row['status'], row.get('as_of'), row.get('reason'))

          assert payload['as_of'] == __import__('os').environ['AS_OF_JST'], payload['as_of']
          candidates=next(row for row in payload['source_status'] if row['name']=='candidates')
          if candidates['status'] == 'OK':
              assert candidates['source_reference'] == 'data/generated/public/candidate-selector.json', candidates
          PY

      - name: Test context optimizer
        if: steps.recovery.outputs.should_generate == 'true'
        run: python3 -m unittest tests.test_context_optimizer

      - name: Generate AI Morning Report
        if: steps.recovery.outputs.should_generate == 'true'
        run: python3 scripts/ai_morning_analyst.py

      - name: Verify generated report
        if: steps.recovery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          day="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/generated/public/morning-dataset.json').read_text())
          print(data['as_of'])
          PY
          )"
          test -f "05_Daily_Reports/Morning/${day}.md"
          test -f "data/generated/diagnostics/openai/${day}.json"
          test -f "data/generated/diagnostics/openai/optimized-morning-dataset.json"
          grep -q "# AI Morning Report" "05_Daily_Reports/Morning/${day}.md"
          grep -q '"status": "OK"' "data/generated/diagnostics/openai/${day}.json"
          grep -q '"context_optimization"' "data/generated/diagnostics/openai/${day}.json"
          grep -q '"optimized_prompt_chars"' "data/generated/diagnostics/openai/${day}.json"

      - name: Commit report and diagnostics
        if: steps.recovery.outputs.should_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 05_Daily_Reports/Morning
          git add -f data/generated/diagnostics/openai
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "chore: add AI morning report ${AS_OF_JST}"
          git push origin HEAD:main
