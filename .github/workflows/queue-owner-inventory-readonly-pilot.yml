name: Queue Owner Inventory Read-only Pilot

# Issue #943: observational workflow only. Not a dispatch or lease issuer.
# This is distinct from the production Queue Auto-Promotion Consumer.
on:
  workflow_dispatch:
  schedule:
    - cron: '21 * * * *'

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: queue-owner-inventory-readonly-pilot
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout diagnostic at triggering commit
        uses: actions/checkout@v4

      - name: Fetch bounded READY issues and complete open PR path inventory
        shell: bash
        run: |
          set -euo pipefail
          # Paginate first; no partial first-page claims.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=READY_FOR_IMPLEMENTATION&per_page=100" \
            | jq 'add // [] | [.[] | select((.pull_request // null) == null and .number != 79)] | sort_by(.number) | .[:1]' \
            > /tmp/ready-raw.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            | jq 'add // [] | [.[] | {number}]' > /tmp/open-prs-raw.json
          echo '{"complete":false,"prs":[]}' > /tmp/open-pr-paths.json
          : > /tmp/pr-paths-staging.jsonl
          # Stage all rows, validate the entire count, then atomically publish.
          # A failed API read or invalid number never makes complete=true.
          expected="$(jq -e 'length' /tmp/open-prs-raw.json)"
          processed=0
          jq -e 'all(.[]; (.number | type == "number" and . > 0 and floor == .))' /tmp/open-prs-raw.json >/dev/null
          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo "INVALID_PR_NUMBER" >&2; exit 78; }
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${number}/files?per_page=100" \
              > "/tmp/pr-files-${number}.json"
            jq -e 'type == "array" and all(.[]; type == "array")' "/tmp/pr-files-${number}.json" >/dev/null
            jq -c --argjson number "$number" '{number:$number,paths:(add // [] | map(.filename))}' \
              "/tmp/pr-files-${number}.json" >> /tmp/pr-paths-staging.jsonl
            processed=$((processed + 1))
          done < <(jq -r '.[].number' /tmp/open-prs-raw.json)
          [[ "$processed" == "$expected" ]] || { echo "INCOMPLETE_PR_INVENTORY" >&2; exit 1; }
          jq -s --argjson expected "$expected" \
            'if length == $expected then {complete:true,prs:.} else error("incomplete inventory") end' \
            /tmp/pr-paths-staging.jsonl > /tmp/open-pr-paths.next.json
          mv /tmp/open-pr-paths.next.json /tmp/open-pr-paths.json

      - name: Normalize claimed issue scope without treating it as authenticated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/ready-raw.json").read_text())
          normalized = []
          for issue in raw[:1]:
              body = issue.get("body") or ""
              owner = ""
              paths = []
              in_paths = False
              # Diagnostic-only extraction of work_contract-like text. A self-declared
              # claim is not an authenticated Owner/Lease issuer.
              for line in body.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("owner_slice:"):
                      owner = stripped.partition(":")[2].strip().strip('"\'')
                  if stripped == "allowed_paths:":
                      in_paths = True
                      continue
                  if in_paths:
                      if stripped.startswith("- "):
                          paths.append(stripped[2:].strip().strip('"\''))
                      elif stripped and not stripped.startswith("#"):
                          in_paths = False
              normalized.append({"number": issue["number"],
                                 "owner_slice": owner, "allowed_paths": paths})
          Path("/tmp/ready-normalized.json").write_text(json.dumps(normalized))
          PY

      - name: Run HOLD-only pilot diagnostic
        id: diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.queue_owner_inventory_pilot \
            --issues /tmp/ready-normalized.json \
            --open-prs /tmp/open-pr-paths.json \
            --output /tmp/owner-pilot-result.json
          jq -e '.status == "HOLD" and .dispatch_allowed == false' /tmp/owner-pilot-result.json >/dev/null

      - name: Preserve sanitized run evidence and summary
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_OUTCOME: ${{ steps.diagnostic.outcome }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/owner-pilot-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          # Only allow diagnostic enums and numeric IDs into the artifact.
          # Never archive API responses, raw issue bodies, claims or credentials.
          reasons = {
              "OWNER_ISSUER_UNVERIFIED", "ISSUE_INVENTORY_INCOMPLETE",
              "NO_READY_CANDIDATE", "ISSUE_PATH_SCOPE_UNVERIFIED",
              "OWNER_SLICE_UNVERIFIED", "PR_PATH_INVENTORY_INCOMPLETE",
              "PR_PATH_CONFLICT", "INPUT_UNAVAILABLE", "OUTPUT_UNAVAILABLE",
          }
          outcome = os.environ.get("DIAGNOSTIC_OUTCOME", "")
          result = {"status": "HOLD", "reason": "DIAGNOSTIC_UNAVAILABLE",
                    "dispatch_allowed": False, "selected_issue": None,
                    "candidate_count": None, "conflicting_prs": None}
          if outcome == "success":
              try:
                  raw = json.loads(Path("/tmp/owner-pilot-result.json").read_text())
                  def positive_id(value):
                      return type(value) is int and value > 0
                  if (not isinstance(raw, dict)
                          or not set(result).issubset(raw)
                          or raw.get("status") != "HOLD"
                          or raw.get("dispatch_allowed") is not False
                          or raw.get("reason") not in reasons
                          or (raw.get("selected_issue") is not None and
                              (not positive_id(raw["selected_issue"]) or raw["selected_issue"] == 79))
                          or type(raw.get("candidate_count")) is not int
                          or raw["candidate_count"] not in (0, 1)
                          or not isinstance(raw.get("conflicting_prs"), list)
                          or not all(positive_id(n) for n in raw["conflicting_prs"])):
                      raise ValueError("invalid diagnostic")
                  reason = raw["reason"]
                  if reason in {"INPUT_UNAVAILABLE", "ISSUE_INVENTORY_INCOMPLETE",
                                "OUTPUT_UNAVAILABLE"}:
                      # A successful process exit is not proof of readable inputs.
                      result["reason"] = reason
                  else:
                      count = raw["candidate_count"]
                      if reason == "NO_READY_CANDIDATE":
                          if count != 0 or raw["selected_issue"] is not None or raw["conflicting_prs"]:
                              raise ValueError("inconsistent zero candidate evidence")
                      elif count != 1 or raw["selected_issue"] is None:
                          raise ValueError("inconsistent bounded candidate evidence")
                      if reason == "PR_PATH_CONFLICT":
                          if not raw["conflicting_prs"]:
                              raise ValueError("missing conflict evidence")
                      elif raw["conflicting_prs"]:
                          raise ValueError("unexpected conflict evidence")
                      result.update({key: raw[key] for key in result})
                      if reason in {"PR_PATH_INVENTORY_INCOMPLETE", "ISSUE_PATH_SCOPE_UNVERIFIED",
                                    "OWNER_SLICE_UNVERIFIED", "NO_READY_CANDIDATE"}:
                          # No complete comparison was performed.
                          result["conflicting_prs"] = None
              except (OSError, ValueError, TypeError, AttributeError, KeyError):
                  result["reason"] = "DIAGNOSTIC_OUTPUT_INVALID_OR_MISSING"
          else:
              result["reason"] = ("DIAGNOSTIC_FAILED" if outcome == "failure"
                                  else "DIAGNOSTIC_NOT_COMPLETED")
          evidence = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "head_sha": os.environ["GITHUB_SHA"],
              "diagnostic_outcome": outcome if outcome in
                  {"success", "failure", "cancelled", "skipped"} else "unknown",
              "result": result,
          }
          Path("/tmp/owner-pilot-evidence/result.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8")
          PY
          {
            echo '## Queue Owner Inventory Read-only Pilot'
            echo 'Dispatch attempts: **0** (workflow is read-only)'
            echo '~~~json'
            cat /tmp/owner-pilot-evidence/result.json
            echo '~~~'
            echo 'Candidate count covers only the bounded pilot (0 or 1), not the entire queue; null means unknown.'
            echo 'A full open-PR path inventory is not an authenticated Owner/Lease ledger.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-owner-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/owner-pilot-evidence/result.json
          if-no-files-found: error
          retention-days: 14
