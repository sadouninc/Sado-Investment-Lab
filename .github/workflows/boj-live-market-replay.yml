name: BOJ Live Market Replay

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: Market date (YYYY-MM-DD)
        required: true
        default: "2026-08-14"
      policy_transaction_id:
        description: Immutable policy transaction ID to reference
        required: true
        default: "2026-08-14-policy-step-002"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-jquants.txt

      - name: Install J-Quants client
        run: python -m pip install --disable-pip-version-check -r requirements-jquants.txt

      - name: Run fail-closed live replay
        id: replay
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_GROWTH250_CODE: ${{ vars.JQUANTS_GROWTH250_CODE }}
        shell: bash
        run: |
          mkdir -p artifacts/boj-live-replay
          set +e
          python scripts/run_boj_live_replay.py \
            --market-date "${{ inputs.market_date }}" \
            --policy-transaction-id "${{ inputs.policy_transaction_id }}" \
            --output "artifacts/boj-live-replay/${{ inputs.market_date }}.json"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boj-live-replay-${{ inputs.market_date }}
          path: artifacts/boj-live-replay/${{ inputs.market_date }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce operational acceptance
        if: steps.replay.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "BOJ live replay was not accepted; see uploaded fail-closed artifact."
          exit 1
