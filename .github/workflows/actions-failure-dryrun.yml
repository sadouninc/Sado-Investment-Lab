name: Actions Failure Analysis Dry Run (#873)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: actions-failure-dryrun-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only failure discovery
        id: analyze
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          rc=0
          PYTHONPATH=. python -m scripts.actions_failure_collector --max-age-hours 24 > actions-failure-result.json 2> actions-failure-stderr.log || rc=$?
          echo "collector_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if ! python -m json.tool actions-failure-result.json >/dev/null 2>&1; then
            echo "::error::Collector produced invalid JSON; no issue created."
            exit 1
          fi
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          try:
              result = json.loads(Path("actions-failure-result.json").read_text())
              if not isinstance(result, dict):
                  raise ValueError("invalid result")
              decision = result.get("decision", "HOLD_MISSING_DECISION")
              reason = result.get("reason", "")
              run_id = result.get("source_run_id", "")
              clean = lambda v: re.sub(r"[^A-Za-z0-9_ .-]", "_", str(v))[:160]
              print("DRYRUN_DECISION=" + clean(decision))
              print("DRYRUN_REASON=" + clean(reason))
              print("DRYRUN_SOURCE_RUN_ID=" + clean(run_id))
              print("DRYRUN_ISSUE_POST=DISABLED")
              print("DRYRUN_READY_DISPATCH=DISABLED")
          except (OSError, ValueError, TypeError):
              print("DRYRUN_DECISION=HOLD_INVALID_OUTPUT")
              print("DRYRUN_ISSUE_POST=DISABLED")
              print("DRYRUN_READY_DISPATCH=DISABLED")
          PY
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Failure discovery returned HOLD; no issue created."
          fi
      - name: Publish non-mutating summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path("actions-failure-result.json")
          try:
              result = json.loads(path.read_text()) if path.exists() else {}
              if not isinstance(result, dict):
                  raise ValueError("invalid result shape")
          except (OSError, ValueError):
              result = {"decision": "HOLD_INVALID_OUTPUT"}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## Actions Failure Analysis — read-only dry run\n\n")
                  for key in ("decision", "reason", "source_run_id"):
                      if key in result:
                          value = re.sub(r"[^A-Za-z0-9_ .-]", "_", str(result[key]))[:160]
                          f.write(f"- {key}: {value}\n")
                  f.write("- issue_post: disabled\n- ready_dispatch: disabled\n")
          PY
