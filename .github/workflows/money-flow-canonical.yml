name: Money Flow Canonical Run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/money-flow-canonical.yml'
      - 'scripts/money_flow_*.py'
      - 'data/config/money-flow-*.json'
      - 'tests/test_money_flow*.py'
  schedule:
    # 17:30 JST, Monday-Friday. Exchange holidays are rejected by the market-session guard.
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      theme_id:
        description: 'Theme to run. Scheduled runs keep AI/DC as the default.'
        required: false
        default: 'theme:ai-data-center-power-infrastructure'
        type: choice
        options:
          - 'theme:ai-data-center-power-infrastructure'
          - 'theme:defense-drone-small-mass-domestic'
      as_of:
        description: 'YYYY-MM-DD (JST). Empty uses current JST date.'
        required: false
        type: string
      backfill_start:
        description: 'Optional YYYY-MM-DD start date for historical backfill.'
        required: false
        type: string
      backfill_end:
        description: 'Optional YYYY-MM-DD end date for historical backfill.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: money-flow-canonical-run
  cancel-in-progress: false

jobs:
  canonical-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Money Flow tests
        run: |
          python -m unittest tests.test_money_flow_canonical_run
          python -m unittest tests.test_money_flow_scheduled_run
          python -m unittest tests.test_money_flow_policy_limitations
          python -m unittest tests.test_money_flow_sector_canonical_run
          python -m unittest tests.test_policy_lead_time_defense_drone

      - name: Resolve run mode
        id: mode
        env:
          INPUT_THEME_ID: ${{ inputs.theme_id }}
          INPUT_AS_OF: ${{ inputs.as_of }}
          BACKFILL_START: ${{ inputs.backfill_start }}
          BACKFILL_END: ${{ inputs.backfill_end }}
        run: |
          set -euo pipefail
          THEME_ID="${INPUT_THEME_ID:-theme:ai-data-center-power-infrastructure}"
          case "$THEME_ID" in
            theme:ai-data-center-power-infrastructure)
              LEAD_TIME_OUTPUT='data/generated/public/money-flow/policy-lead-time-ai-dc.json'
              V2_OUTPUT='data/generated/public/money-flow/policy-lead-time-ai-dc-v2.json'
              ;;
            theme:defense-drone-small-mass-domestic)
              LEAD_TIME_OUTPUT='data/generated/public/money-flow/policy-lead-time-defense-drone.json'
              V2_OUTPUT='data/generated/public/money-flow/policy-lead-time-defense-drone-v2.json'
              ;;
            *)
              echo "unsupported theme_id: $THEME_ID" >&2
              exit 2
              ;;
          esac
          echo "theme_id=$THEME_ID" >> "$GITHUB_OUTPUT"
          echo "lead_time_output=$LEAD_TIME_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "v2_output=$V2_OUTPUT" >> "$GITHUB_OUTPUT"

          if [ -n "${BACKFILL_START:-}" ]; then
            if [ -z "${BACKFILL_END:-}" ]; then
              echo 'backfill_end is required when backfill_start is supplied' >&2
              exit 2
            fi
            if [ -n "${INPUT_AS_OF:-}" ]; then
              echo 'as_of cannot be combined with backfill_start/backfill_end' >&2
              exit 2
            fi
            echo 'mode=BACKFILL' >> "$GITHUB_OUTPUT"
            echo "as_of=${BACKFILL_START}..${BACKFILL_END}" >> "$GITHUB_OUTPUT"
          else
            if [ -n "${BACKFILL_END:-}" ]; then
              echo 'backfill_start is required when backfill_end is supplied' >&2
              exit 2
            fi
            if [ -n "${INPUT_AS_OF:-}" ]; then
              AS_OF="$INPUT_AS_OF"
            else
              AS_OF="$(TZ=Asia/Tokyo date +%F)"
            fi
            python - <<'PY' "$AS_OF"
          import datetime, sys
          datetime.date.fromisoformat(sys.argv[1])
          PY
            echo 'mode=SCHEDULED' >> "$GITHUB_OUTPUT"
            echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run guarded current-session snapshot
        if: steps.mode.outputs.mode == 'SCHEDULED'
        id: scheduled
        run: |
          set -o pipefail
          python -m scripts.money_flow_scheduled_run \
            --as-of '${{ steps.mode.outputs.as_of }}' \
            --theme-id '${{ steps.mode.outputs.theme_id }}' | tee /tmp/money-flow-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/money-flow-run.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"status={payload['status']}\n")
              fh.write(f"reason={payload['guard']['reason']}\n")
          PY

      - name: Run Sector canonical snapshot
        if: steps.mode.outputs.mode == 'SCHEDULED' && steps.scheduled.outputs.status == 'COMPLETED' && steps.mode.outputs.theme_id == 'theme:ai-data-center-power-infrastructure'
        id: sector
        run: |
          set +e
          python -m scripts.money_flow_sector_canonical_run --as-of '${{ steps.mode.outputs.as_of }}' > /tmp/money-flow-sector-run.json
          rc=$?
          set -e

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            cat /tmp/money-flow-sector-run.json || true
            exit "$rc"
          fi

          python - <<'PY' "$rc"
          import json, os, sys
          from pathlib import Path

          rc = int(sys.argv[1])
          payload = json.loads(Path('/tmp/money-flow-sector-run.json').read_text())
          snapshot_set = payload.get('snapshot_set') or {}
          status = 'COMPLETED' if rc == 0 else 'SKIPPED_UNAVAILABLE'
          reason = snapshot_set.get('missing_reason') or ''
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"status={status}\n")
              fh.write(f"reason={reason}\n")
          PY

      - name: Run bounded historical backfill
        if: steps.mode.outputs.mode == 'BACKFILL'
        env:
          BACKFILL_START: ${{ inputs.backfill_start }}
          BACKFILL_END: ${{ inputs.backfill_end }}
        run: |
          set -euo pipefail
          python -m scripts.money_flow_canonical_run \
            --backfill-start "$BACKFILL_START" \
            --backfill-end "$BACKFILL_END" \
            --backfill-range 2y \
            --theme-id '${{ steps.mode.outputs.theme_id }}' \
            --lead-time-output '${{ steps.mode.outputs.lead_time_output }}'

      - name: Refresh AI/DC Policy Lead-Time projection
        if: steps.mode.outputs.theme_id == 'theme:ai-data-center-power-infrastructure' && (steps.mode.outputs.mode == 'BACKFILL' || steps.scheduled.outputs.status == 'COMPLETED')
        run: |
          python -m scripts.policy_lead_time_ai_dc \
            --output '${{ steps.mode.outputs.v2_output }}'

      - name: Refresh Defense Drone Policy Lead-Time projection
        if: steps.mode.outputs.theme_id == 'theme:defense-drone-small-mass-domestic' && (steps.mode.outputs.mode == 'BACKFILL' || steps.scheduled.outputs.status == 'COMPLETED')
        run: |
          python -m scripts.policy_lead_time_defense_drone \
            --output '${{ steps.mode.outputs.v2_output }}'

      - name: Persist canonical Market Evidence
        if: steps.mode.outputs.mode == 'BACKFILL' || steps.scheduled.outputs.status == 'COMPLETED'
        run: |
          set -euo pipefail
          git add data/generated/public/money-flow/history.jsonl
          if [ -f data/generated/public/money-flow/sector-history.jsonl ]; then
            git add data/generated/public/money-flow/sector-history.jsonl
          fi
          if [ -f '${{ steps.mode.outputs.lead_time_output }}' ]; then
            git add '${{ steps.mode.outputs.lead_time_output }}'
          fi
          if [ -f '${{ steps.mode.outputs.v2_output }}' ]; then
            git add '${{ steps.mode.outputs.v2_output }}'
          fi
          if git diff --cached --quiet; then
            echo 'No canonical Money Flow changes to persist (idempotent rerun).'
            exit 0
          fi
          git config user.name 'sado-investment-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'data: persist canonical Money Flow evidence [担当: automation]'
          git push origin HEAD:main

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Money Flow Canonical Run'
            echo '- mode: `${{ steps.mode.outputs.mode }}`'
            echo '- as_of: `${{ steps.mode.outputs.as_of }}`'
            echo '- theme: `${{ steps.mode.outputs.theme_id }}`'
            echo '- scheduled status: `${{ steps.scheduled.outputs.status }}`'
            echo '- scheduled guard: `${{ steps.scheduled.outputs.reason }}`'
            echo '- sector status: `${{ steps.sector.outputs.status }}`'
            echo '- sector guard: `${{ steps.sector.outputs.reason }}`'
            echo ''
            echo 'Scheduled runs default to AI/DC. Manual workflow_dispatch can select Defense Drone. Historical backfills remain bounded to each as_of so future observations cannot leak into past detector states. Defense Drone outputs are kept separate from AI/DC outputs.'
          } >> "$GITHUB_STEP_SUMMARY"
