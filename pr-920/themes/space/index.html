  <script>
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('book-theme');
    if (savedTheme) root.dataset.theme = savedTheme;
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('book-theme', next);
    });
    const progress = document.getElementById('progress');
    const updateProgress = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? window.scrollY / max * 100 : 0) + '%';
    };
    addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();

    (() => {
      const normalizedPath = window.location.pathname.replace(/\/+$/, '');
      if (!normalizedPath.endsWith('/research/ai-key-person-watch')) return;
      const main = document.querySelector('main.book-shell');
      const title = main?.querySelector('h1');
      if (!main || !title) return;

      const panel = document.createElement('section');
      panel.className = 'notice-card';
      panel.setAttribute('aria-live', 'polite');
      panel.innerHTML = '<strong>Monitoring status</strong><p>Heartbeatを確認中...</p>';
      title.insertAdjacentElement('afterend', panel);

      const issueCommentsBaseUrl = 'https://api.github.com/repos/sadouninc/Sado-Investment-Lab/issues/124/comments?per_page=100';
      const trustedAuditAuthors = new Set(['sadouninc']);
      const statusUrl = 'https://raw.githubusercontent.com/sadouninc/Sado-Investment-Lab/main/Ops/Monitoring/AI_Key_Person_Watch/status.json';
      const staleAfterMinutes = 150;
      const maxFutureSkewMinutes = 5;
      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const renderTime = (value) => value
        ? new Date(value).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) + ' JST'
        : '未記録';

      // AI_WATCH_CONTRACT_START
      const validRunStatuses = new Set(['OK', 'ERROR', 'UNKNOWN']);
      const validPersistenceStatuses = new Set(['COMPLETED', 'PENDING_PERSIST', 'NOT_REQUIRED']);
      const parseJst = (value) => {
        if (!value) return null;
        const normalized = value.trim().replace(/\s*JST$/i, '').replace(' ', 'T');
        const withOffset = /(?:Z|[+-]\d{2}:?\d{2})$/.test(normalized) ? normalized : `${normalized}+09:00`;
        const parsed = new Date(withOffset);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      };
      const isTooFarFuture = (date) => date && date.getTime() > Date.now() + maxFutureSkewMinutes * 60000;
      const validateFields = ({ status, newsDelta, newsPersisted, persistenceStatus }) => {
        if (!validRunStatuses.has(status)) return 'statusが正規enumではありません。';
        if (!Number.isInteger(newsDelta) || newsDelta < 0) return 'news_deltaが非負整数ではありません。';
        if (typeof newsPersisted !== 'boolean') return 'news_persistedがbooleanではありません。';
        if (!validPersistenceStatuses.has(persistenceStatus)) return 'persistence_statusが正規enumではありません。';
        if (newsDelta === 0 && (newsPersisted || persistenceStatus !== 'NOT_REQUIRED')) {
          return '差分0件と保存状態が矛盾しています。';
        }
        if (newsDelta > 0) {
          const completed = newsPersisted && persistenceStatus === 'COMPLETED';
          const pending = !newsPersisted && persistenceStatus === 'PENDING_PERSIST';
          if (!completed && !pending) return 'ニュース差分と保存状態が矛盾しています。';
        }
        return null;
      };
      const parseAuditComment = (comment) => {
        const author = String(comment?.user?.login || '').toLowerCase();
        if (!trustedAuditAuthors.has(author)) return null;
        const body = comment?.body;
        if (!body || !body.includes('Operational Heartbeat / Run Audit')) return null;
        const field = (name) => {
          const match = body.match(new RegExp(`^${name}:\\s*(.+)$`, 'mi'));
          return match ? match[1].trim() : null;
        };
        const runAt = parseJst(field('run_at_jst'));
        const status = String(field('status') || '').toUpperCase();
        const deltaText = field('news_delta');
        const persistedText = String(field('news_persisted') || '').toLowerCase();
        if (!runAt || !status) return null;
        return {
          runAt,
          status,
          newsDelta: deltaText !== null && /^\d+$/.test(deltaText) ? Number(deltaText) : Number.NaN,
          newsPersisted: persistedText === 'true' ? true : persistedText === 'false' ? false : null,
          persistenceStatus: String(field('persistence_status') || '').toUpperCase()
        };
      };
      const classifyAudit = (audit) => {
        const invalid = validateFields(audit);
        if (invalid) return { state: 'DEGRADED', reason: invalid };
        if (isTooFarFuture(audit.runAt)) {
          return { state: 'DEGRADED', reason: `直近run時刻が現在より${maxFutureSkewMinutes}分超先です。` };
        }
        if (audit.status === 'ERROR') return { state: 'DEGRADED', reason: '直近runがERRORです。' };
        if (audit.status === 'UNKNOWN') return { state: 'DEGRADED', reason: '直近runがUNKNOWNです。' };
        if (audit.persistenceStatus === 'PENDING_PERSIST') return { state: 'DEGRADED', reason: 'ニュース保存がPENDING_PERSISTです。' };
        const ageMinutes = (Date.now() - audit.runAt.getTime()) / 60000;
        if (ageMinutes > staleAfterMinutes) {
          return { state: 'STALE', reason: `最終runから約${Math.floor(ageMinutes)}分経過しています。` };
        }
        return { state: 'HEALTHY', reason: 'Issue #124の直近Run Auditは監視閾値内です。' };
      };
      const classifyStatusFile = (payload) => {
        const lastRun = payload?.last_run_at ? new Date(payload.last_run_at) : null;
        const lastSuccess = payload?.last_success_at ? new Date(payload.last_success_at) : null;
        const lastNewsDelta = payload?.last_news_delta_at ? new Date(payload.last_news_delta_at) : null;
        if (!lastRun || Number.isNaN(lastRun.getTime())) return { state: 'UNKNOWN', reason: 'last_run_atが無効です。' };
        if (!lastSuccess || Number.isNaN(lastSuccess.getTime())) return { state: 'UNKNOWN', reason: '成功runを確認できません。' };
        if (lastNewsDelta && Number.isNaN(lastNewsDelta.getTime())) return { state: 'DEGRADED', reason: 'last_news_delta_atが無効です。' };
        const status = String(payload.last_status || '').toUpperCase();
        const persistenceStatus = String(payload.persistence_status || '').toUpperCase();
        const invalid = validateFields({
          status,
          newsDelta: payload.news_delta,
          newsPersisted: payload.news_persisted,
          persistenceStatus
        });
        if (invalid) return { state: 'DEGRADED', reason: invalid };
        const staleAfter = Number(payload.stale_after_minutes);
        if (!Number.isFinite(staleAfter) || staleAfter <= 0) return { state: 'DEGRADED', reason: 'stale_after_minutesが無効です。' };
        if (isTooFarFuture(lastRun) || isTooFarFuture(lastSuccess) || isTooFarFuture(lastNewsDelta)) {
          return { state: 'DEGRADED', reason: `Heartbeat timestampが現在より${maxFutureSkewMinutes}分超先です。` };
        }
        if (lastSuccess.getTime() > lastRun.getTime()) return { state: 'DEGRADED', reason: 'last_success_atがlast_run_atより後です。' };
        if (lastNewsDelta && lastNewsDelta.getTime() > lastRun.getTime()) {
          return { state: 'DEGRADED', reason: 'last_news_delta_atがlast_run_atより後です。' };
        }
        if (status === 'ERROR') return { state: 'DEGRADED', reason: '直近runがERRORです。' };
        if (status === 'UNKNOWN') return { state: 'DEGRADED', reason: '直近runがUNKNOWNです。' };
        if (persistenceStatus === 'PENDING_PERSIST') return { state: 'DEGRADED', reason: 'ニュース保存がPENDING_PERSISTです。' };
        const ageMinutes = (Date.now() - lastSuccess.getTime()) / 60000;
        if (ageMinutes > staleAfter) return { state: 'STALE', reason: `最終成功runから約${Math.floor(ageMinutes)}分経過しています。` };
        return { state: 'HEALTHY', reason: 'status.jsonの直近成功runは監視閾値内です。' };
      };
      const stateRank = { DEGRADED: 3, UNKNOWN: 2, STALE: 1, HEALTHY: 0 };
      const selectMonitoringSource = (audit, statusPayload) => {
        const candidates = [];
        if (audit) candidates.push({
          kind: 'audit',
          observedAt: audit.runAt,
          data: audit,
          health: classifyAudit(audit)
        });
        if (statusPayload) {
          const observedAt = statusPayload.last_run_at ? new Date(statusPayload.last_run_at) : null;
          candidates.push({
            kind: 'status',
            observedAt,
            data: statusPayload,
            health: classifyStatusFile(statusPayload)
          });
        }
        return candidates.sort((a, b) => {
          const aTime = a.observedAt && !Number.isNaN(a.observedAt.getTime()) ? a.observedAt.getTime() : -Infinity;
          const bTime = b.observedAt && !Number.isNaN(b.observedAt.getTime()) ? b.observedAt.getTime() : -Infinity;
          return bTime - aTime || (stateRank[b.health.state] || 0) - (stateRank[a.health.state] || 0);
        })[0] || null;
      };
      // AI_WATCH_CONTRACT_END

      const renderAudit = (audit, health) => {
        panel.innerHTML = `<strong>Monitoring status: ${escapeHtml(health.state)}</strong><dl>`
          + `<dt>直近run</dt><dd>${escapeHtml(renderTime(audit.runAt.toISOString()))}</dd>`
          + `<dt>ニュース差分</dt><dd>${escapeHtml(audit.newsDelta)}</dd>`
          + `<dt>Persistence</dt><dd>${escapeHtml(audit.persistenceStatus)}</dd>`
          + '<dt>監視ソース</dt><dd>Issue #124 Run Audit (freshest validated)</dd>'
          + `<dt>状態理由</dt><dd>${escapeHtml(health.reason)}</dd></dl>`;
      };
      const renderStatusFile = (payload, health) => {
        panel.innerHTML = `<strong>Monitoring status: ${escapeHtml(health.state)}</strong><dl>`
          + `<dt>最終監視成功</dt><dd>${escapeHtml(renderTime(payload.last_success_at))}</dd>`
          + `<dt>最終ニュース差分</dt><dd>${escapeHtml(renderTime(payload.last_news_delta_at))}</dd>`
          + `<dt>直近run</dt><dd>${escapeHtml(renderTime(payload.last_run_at))}</dd>`
          + '<dt>監視ソース</dt><dd>status.json (freshest validated)</dd>'
          + `<dt>状態理由</dt><dd>${escapeHtml(health.reason)}</dd></dl>`;
      };

      const linkedPage = (header, rel) => {
        for (const part of String(header || '').split(',')) {
          if (!part.includes(`rel="${rel}"`)) continue;
          const url = part.match(/<([^>]+)>/)?.[1];
          if (!url) continue;
          const page = new URL(url).searchParams.get('page');
          if (page && /^\d+$/.test(page)) return Number(page);
        }
        return null;
      };
      const fetchIssuePage = (page) => fetch(`${issueCommentsBaseUrl}&page=${page}`, {
        cache: 'no-store',
        headers: { Accept: 'application/vnd.github+json' }
      }).then((response) => {
        if (!response.ok) throw new Error(`Issue API HTTP ${response.status}`);
        return response.json().then((comments) => ({
          comments,
          link: response.headers.get('link')
        }));
      });
      const latestTrustedAudit = (comments) => {
        const audits = comments.map(parseAuditComment).filter(Boolean);
        audits.sort((a, b) => b.runAt.getTime() - a.runAt.getTime());
        return audits[0] || null;
      };
      const findLatestTrustedAudit = (page) => fetchIssuePage(page).then(({ comments }) => {
        const audit = latestTrustedAudit(comments);
        if (audit) return audit;
        if (page <= 1) throw new Error('Issue #124に信頼済みRun Auditがありません');
        return findLatestTrustedAudit(page - 1);
      });
      const loadLatestIssueAudit = () => fetchIssuePage(1).then(({ comments, link }) => {
        const lastPage = linkedPage(link, 'last') || linkedPage(link, 'next') || 1;
        if (lastPage === 1) {
          const audit = latestTrustedAudit(comments);
          if (!audit) throw new Error('Issue #124に信頼済みRun Auditがありません');
          return audit;
        }
        return findLatestTrustedAudit(lastPage);
      });
      const loadStatusFile = () => fetch(`${statusUrl}?t=${Date.now()}`, { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error(`status.json HTTP ${response.status}`);
          return response.json();
        });

      Promise.allSettled([loadLatestIssueAudit(), loadStatusFile()]).then(([auditResult, statusResult]) => {
        const audit = auditResult.status === 'fulfilled' ? auditResult.value : null;
        const statusPayload = statusResult.status === 'fulfilled' ? statusResult.value : null;
        const selected = selectMonitoringSource(audit, statusPayload);
        if (!selected) {
          const issueError = auditResult.reason?.message || 'Issue audit unavailable';
          const statusError = statusResult.reason?.message || 'status.json unavailable';
          panel.innerHTML = `<strong>Monitoring status: UNKNOWN</strong><p>Heartbeat取得に失敗しました: ${escapeHtml(issueError)} / ${escapeHtml(statusError)}</p>`;
          return;
        }
        if (selected.kind === 'audit') renderAudit(selected.data, selected.health);
        else renderStatusFile(selected.data, selected.health);
      });
    })();
  </script>
</body>
</html>
