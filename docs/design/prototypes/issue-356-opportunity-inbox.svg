<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">#356 Opportunity Inbox Prototype</title><desc id="desc">Owner-facing opportunity candidates emphasizing why now, transmission, evidence, counter-evidence, next checkpoint and status.</desc><defs><style>.bg{fill:#f2eee5}.panel{fill:#fbf8f1;stroke:#d4c8b6;stroke-width:1.5}.ink{fill:#211f19}.muted{fill:#6f685c}.green{fill:#284b3b}.brass{fill:#8c6f3d}.warn{fill:#8a443b}.sans{font-family:'Noto Sans JP',system-ui,sans-serif}.serif{font-family:'Noto Serif JP','Yu Mincho',serif}.h1{font-size:38px;font-weight:700}.h2{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:13px}</style></defs><rect class="bg" width="1440" height="980"/><text x="70" y="70" class="serif ink h1">新しい投資機会候補</text><text x="70" y="105" class="sans muted body">昇格候補だけを見る · BUY/SELLではない · freshnessを確認</text><rect class="panel" x="70" y="150" width="620" height="690" rx="16"/><text x="100" y="195" class="sans green small">RESEARCH_CANDIDATE · updated today</text><text x="100" y="235" class="serif ink h2">AIデータセンター電力設備</text><text x="100" y="280" class="sans muted small">WHY NOW</text><text x="100" y="310" class="sans ink body">大型CAPEXが設備受注へ波及する兆候を継続確認。</text><text x="100" y="355" class="sans muted small">TRANSMISSION</text><text x="100" y="385" class="sans ink body">CAPEX → 変圧器/配電設備 → 受注 → 売上・利益</text><rect class="panel" x="100" y="425" width="260" height="110" rx="12"/><text x="120" y="458" class="sans muted small">Signal Lead</text><text x="120" y="492" class="sans green h2">HIGH</text><rect class="panel" x="390" y="425" width="260" height="110" rx="12"/><text x="410" y="458" class="sans muted small">Evidence quality</text><text x="410" y="492" class="sans green h2">PRIMARY + 2</text><text x="100" y="580" class="sans muted small">COUNTER-EVIDENCE</text><text x="100" y="610" class="sans warn body">設備投資延期 / 供給制約解消 / 既織込みを確認</text><text x="100" y="665" class="sans muted small">NEXT CHECKPOINT</text><text x="100" y="697" class="sans ink body">変圧器受注・次回決算</text><text x="100" y="760" class="sans brass small">詳細: Evidence / Counter-evidence / Seed lineage</text><rect class="panel" x="750" y="150" width="620" height="690" rx="16"/><text x="780" y="195" class="sans green small">OPPORTUNITY_CANDIDATE · updated 2d ago</text><text x="780" y="235" class="serif ink h2">Physical AI / Factory Automation</text><text x="780" y="280" class="sans muted small">WHY NOW</text><text x="780" y="310" class="sans ink body">政策・AI投資・現場自動化の接続が具体化。</text><text x="780" y="355" class="sans muted small">TRANSMISSION</text><text x="780" y="385" class="sans ink body">Policy/AI → 設備投資 → FA/robotics demand → Company research</text><rect class="panel" x="780" y="425" width="260" height="110" rx="12"/><text x="800" y="458" class="sans muted small">Expectation Gap</text><text x="800" y="492" class="sans brass h2">MEDIUM</text><rect class="panel" x="1070" y="425" width="260" height="110" rx="12"/><text x="1090" y="458" class="sans muted small">Counter evidence</text><text x="1090" y="492" class="sans ink h2">2 items</text><text x="780" y="580" class="sans muted small">COUNTER-EVIDENCE</text><text x="780" y="610" class="sans warn body">需要時期 / 収益化距離 / valuationを別確認</text><text x="780" y="665" class="sans muted small">NEXT CHECKPOINT</text><text x="780" y="697" class="sans ink body">具体受注・企業側KPI</text><text x="780" y="760" class="sans brass small">OPPORTUNITY_CANDIDATE ≠ BUY</text><text x="70" y="915" class="sans muted body">390px: 1候補=1 vertical card · Why now → Transmission → Evidence/Counter-evidence → Next checkpoint</text></svg>