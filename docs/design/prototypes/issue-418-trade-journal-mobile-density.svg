<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Trade Journal mobile density prototype</title>
  <desc id="desc">390 pixel wide prototype showing compact year, month, and journal entry hierarchy.</desc>
  <rect width="390" height="844" fill="#f4f0e7"/>
  <g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#171612">
    <text x="20" y="54" font-size="32" font-weight="700">Trade Journal</text>
    <text x="20" y="82" font-size="14" fill="#6f695e">市場認識、判断、売買、反省、改善を時系列で振り返ります。</text>

    <text x="20" y="128" font-size="24" font-weight="700">2026</text>
    <text x="20" y="162" font-size="17" font-weight="600" fill="#6f695e">August</text>

    <g transform="translate(20 180)">
      <rect width="350" height="78" rx="8" fill="#fffdf7" stroke="#cfc5b4"/>
      <text x="16" y="31" font-size="17" font-weight="700">2026-08-05</text>
      <text x="16" y="56" font-size="13" fill="#6f695e">2026-08-05.md</text>
    </g>
    <g transform="translate(20 268)">
      <rect width="350" height="78" rx="8" fill="#fffdf7" stroke="#cfc5b4"/>
      <text x="16" y="31" font-size="17" font-weight="700">2026-08-04</text>
      <text x="16" y="56" font-size="13" fill="#6f695e">2026-08-04.md</text>
    </g>
    <g transform="translate(20 356)">
      <rect width="350" height="78" rx="8" fill="#fffdf7" stroke="#cfc5b4"/>
      <text x="16" y="31" font-size="17" font-weight="700">2026-08-03</text>
      <text x="16" y="56" font-size="13" fill="#6f695e">2026-08-03.md</text>
    </g>

    <text x="20" y="488" font-size="17" font-weight="600" fill="#6f695e">July</text>
    <g transform="translate(20 506)">
      <rect width="350" height="78" rx="8" fill="#fffdf7" stroke="#cfc5b4"/>
      <text x="16" y="31" font-size="17" font-weight="700">2026-07-31</text>
      <text x="16" y="56" font-size="13" fill="#6f695e">2026-07-31.md</text>
    </g>
  </g>
</svg>
