<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">#414 Primary Evidence Source Library</title><desc id="desc">Mobile-first evidence source cards with archive status, period, primary-source access, and research return path.</desc><rect width="1200" height="820" fill="#f2eee5"/><text x="54" y="66" font-family="serif" font-size="34" font-weight="700" fill="#211f19">Primary Evidence Source Library</text><text x="54" y="100" font-family="sans-serif" font-size="17" fill="#6f685c">企業Research ↔ 一次資料を往復。保存状態を誤認しない。</text><rect x="54" y="136" width="1092" height="98" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="82" y="174" font-family="sans-serif" font-size="14" fill="#6f685c">日東紡 · FY2027 Q1</text><text x="82" y="207" font-family="sans-serif" font-size="22" font-weight="700" fill="#284b3b">Coverage: 2 ARCHIVED / 1 NEEDS_RECOVERY</text><g transform="translate(54 270)"><rect width="340" height="330" rx="18" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="42" font-family="sans-serif" font-size="13" fill="#6f685c">EARNINGS PRESENTATION · FY2027 Q1</text><text x="24" y="80" font-family="sans-serif" font-size="22" font-weight="700" fill="#211f19">決算説明資料</text><text x="24" y="120" font-family="sans-serif" font-size="15" fill="#284b3b">ARCHIVED · Primary verified</text><text x="24" y="160" font-family="sans-serif" font-size="14" fill="#6f685c">Published 2026-08-04</text><rect x="24" y="198" width="292" height="46" rx="10" fill="#284b3b"/><text x="102" y="227" font-family="sans-serif" font-size="15" fill="#fff">原資料を開く</text><rect x="24" y="258" width="292" height="46" rx="10" fill="#f6f0e5" stroke="#d4c8b6"/><text x="105" y="287" font-family="sans-serif" font-size="15" fill="#211f19">Researchへ戻る</text></g><g transform="translate(430 270)"><rect width="340" height="330" rx="18" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="42" font-family="sans-serif" font-size="13" fill="#6f685c">EARNINGS RELEASE · FY2027 Q1</text><text x="24" y="80" font-family="sans-serif" font-size="22" font-weight="700" fill="#211f19">決算短信</text><text x="24" y="120" font-family="sans-serif" font-size="15" fill="#8c6f3d">URL_ONLY · 未Archive</text><text x="24" y="160" font-family="sans-serif" font-size="14" fill="#6f685c">Official URL available</text><rect x="24" y="198" width="292" height="46" rx="10" fill="#f6f0e5" stroke="#d4c8b6"/><text x="88" y="227" font-family="sans-serif" font-size="15" fill="#211f19">公式URLを開く</text><rect x="24" y="258" width="292" height="46" rx="10" fill="#f6f0e5" stroke="#d4c8b6"/><text x="105" y="287" font-family="sans-serif" font-size="15" fill="#211f19">Researchへ戻る</text></g><g transform="translate(806 270)"><rect width="340" height="330" rx="18" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="42" font-family="sans-serif" font-size="13" fill="#6f685c">MIDTERM PLAN</text><text x="24" y="80" font-family="sans-serif" font-size="22" font-weight="700" fill="#211f19">中期経営計画</text><text x="24" y="120" font-family="sans-serif" font-size="15" fill="#8a443b">NEEDS_RECOVERY</text><text x="24" y="160" font-family="sans-serif" font-size="14" fill="#6f685c">過去利用あり / Archive未回収</text><rect x="24" y="198" width="292" height="46" rx="10" fill="#f6f0e5" stroke="#d4c8b6"/><text x="100" y="227" font-family="sans-serif" font-size="15" fill="#211f19">回収状況を見る</text><rect x="24" y="258" width="292" height="46" rx="10" fill="#f6f0e5" stroke="#d4c8b6"/><text x="105" y="287" font-family="sans-serif" font-size="15" fill="#211f19">Researchへ戻る</text></g><text x="54" y="668" font-family="sans-serif" font-size="15" fill="#6f685c">390px: 1 source = 1 vertical card · filename/hash/source_idはdetailsへ · URL_ONLY ≠ ARCHIVED</text></svg>