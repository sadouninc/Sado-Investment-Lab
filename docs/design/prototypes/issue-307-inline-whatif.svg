<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Sado Investment Codex — Pre-trade What-if Inline Prototype</title><desc id="desc">Owner-facing pre-trade what-if prototype showing trade assumptions, non-order boundary, before and after portfolio impact, rule result, warnings and condition revision.</desc>
<defs><style>.bg{fill:#f2eee5}.panel{fill:#faf8f2;stroke:#d6d0c3;stroke-width:1.5}.nav{fill:#173f35}.ink{fill:#1b201d}.muted{fill:#626860}.green{fill:#173f35}.brass{fill:#8f7748}.warn{fill:#8d3e3b}.unknown{fill:#746b61}.serif{font-family:'Noto Serif JP','Yu Mincho',serif}.sans{font-family:'Noto Sans JP',system-ui,sans-serif}.mono{font-family:ui-monospace,monospace}.small{font-size:15px}.body{font-size:18px}.label{font-size:16px;font-weight:700}.h2{font-size:25px;font-weight:700}.h1{font-size:40px;font-weight:700}.kpi{font-size:28px;font-weight:700}</style></defs>
<rect class="bg" width="1440" height="1120"/><rect class="nav" width="1440" height="74"/><text x="54" y="46" class="serif" fill="#f7f4eb" font-size="26" font-weight="700">Sado Investment Codex</text><text x="1015" y="45" class="sans" fill="#d9d2c4" font-size="15">COCKPIT / PRE-FLIGHT / EVIDENCE / RECORD</text>
<text x="60" y="124" class="sans muted small">VISUAL PROTOTYPE · Issue #307 · v0.1</text><text x="60" y="172" class="serif ink h1">Pre-trade Portfolio What-if</text><text x="60" y="205" class="sans muted body">売買前に、仮定した取引がPortfolioへ与える影響だけを確認する。</text>
<rect class="panel" x="60" y="235" width="1320" height="98" rx="14"/><text x="88" y="268" class="sans muted small">対象 / price freshness</text><text x="88" y="300" class="serif ink h2">ダイヘン · 6622 · Price FRESH</text><text x="980" y="268" class="sans warn label">これは注文ではありません</text><text x="980" y="300" class="sans muted small">入力だけではPosition / Decision / Executionを変更しません</text>
<text x="60" y="386" class="serif ink h2">1. 売買仮定</text><rect class="panel" x="60" y="410" width="1320" height="170" rx="14"/>
<text x="88" y="446" class="sans muted small">Action</text><rect x="88" y="462" width="142" height="50" rx="10" fill="#173f35"/><text x="159" y="493" text-anchor="middle" class="sans" fill="#f7f4eb" font-size="17" font-weight="700">BUY</text><rect x="242" y="462" width="142" height="50" rx="10" fill="#faf8f2" stroke="#d6d0c3"/><text x="313" y="493" text-anchor="middle" class="sans ink label">SELL</text>
<text x="430" y="446" class="sans muted small">Quantity</text><rect class="panel" x="430" y="462" width="210" height="50" rx="10"/><text x="452" y="494" class="mono ink body">100 株</text><text x="690" y="446" class="sans muted small">Price</text><rect class="panel" x="690" y="462" width="250" height="50" rx="10"/><text x="712" y="494" class="mono ink body">¥ 8,000</text><text x="990" y="446" class="sans muted small">Account</text><rect class="panel" x="990" y="462" width="190" height="50" rx="10"/><text x="1012" y="494" class="sans ink body">UNKNOWN</text><rect x="1210" y="454" width="142" height="58" rx="11" fill="#173f35"/><text x="1281" y="489" text-anchor="middle" class="sans" fill="#f7f4eb" font-size="16" font-weight="700">PF影響を確認</text><text x="88" y="548" class="sans brass label">仮定: ダイヘンを100株、8,000円でBUY。実発注は行いません。</text>
<text x="60" y="636" class="serif ink h2">2. Portfolio Before → After</text>
<rect class="panel" x="60" y="660" width="405" height="180" rx="14"/><text x="86" y="694" class="sans muted small">Position Weight</text><text x="86" y="738" class="mono ink kpi">4.2% → 7.1%</text><text x="86" y="780" class="sans brass label">+2.9pt</text><text x="86" y="812" class="sans muted small">例示値 · canonical calculator authority</text>
<rect class="panel" x="492" y="660" width="405" height="180" rx="14"/><text x="518" y="694" class="sans muted small">Cash / Buying Power</text><text x="518" y="738" class="mono ink kpi">¥1.30m → ¥0.50m</text><text x="518" y="780" class="sans warn label">余力低下を確認</text><text x="518" y="812" class="sans muted small">取得不能なら UNKNOWN</text>
<rect class="panel" x="924" y="660" width="456" height="180" rx="14"/><text x="950" y="694" class="sans muted small">Theme Concentration</text><text x="950" y="738" class="mono ink kpi">18% → 24%</text><text x="950" y="780" class="sans warn label">WARN · concentration</text><text x="950" y="812" class="sans muted small">#233 rule semanticsをそのまま表示</text>
<text x="60" y="894" class="serif ink h2">3. Rule / Data status</text><rect class="panel" x="60" y="918" width="840" height="130" rx="14"/><text x="88" y="954" class="sans warn label">WARN · 追加確認が必要</text><text x="88" y="993" class="serif ink h2">テーマ集中度が上昇します</text><text x="88" y="1026" class="sans muted small">PASS/WARN/BLOCK_REVIEW/UNKNOWNは売買推奨ではありません。</text>
<rect class="panel" x="930" y="918" width="450" height="130" rx="14"/><text x="956" y="954" class="sans green label">条件を修正する</text><text x="956" y="993" class="sans body">数量・価格を変えて再確認</text><text x="956" y="1026" class="sans muted small">Diagnostics ▾ request/run identityは詳細へ</text>
<text x="60" y="1090" class="sans muted small">390px: target/freshness/non-order → intent → Before/After → rule/data status → revise · no Actions-first hierarchy</text><text x="1380" y="1090" text-anchor="end" class="sans muted small">#320 Visual Contract reuse</text>
</svg>
