<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">#418 Final Cross-page Mobile Density Prototype</title><desc id="desc">Four representative mobile layouts for Cockpit guide, Companies, Trade Journal and Home with compact headings, reduced vertical whitespace and shared design-system hierarchy.</desc><defs><style>.bg{fill:#f2eee5}.panel{fill:#fbf8f1;stroke:#d4c8b6;stroke-width:1.5}.phone{fill:#fffdf7;stroke:#284b3b;stroke-width:3}.ink{fill:#211f19}.muted{fill:#6f685c}.green{fill:#284b3b}.brass{fill:#8c6f3d}.sans{font-family:'Noto Sans JP',system-ui,sans-serif}.serif{font-family:'Noto Serif JP','Yu Mincho',serif}.h1{font-size:28px;font-weight:700}.h2{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px}</style></defs><rect class="bg" width="1440" height="980"/><text x="60" y="68" class="serif ink" font-size="38" font-weight="700">#418 Mobile Density — Final Cross-page Sweep</text><text x="60" y="100" class="sans muted body">390px baseline · shared typography / spacing / density · no second CSS system</text><g transform="translate(60 150)"><rect class="phone" x="0" y="0" width="300" height="720" rx="26"/><text x="24" y="50" class="sans muted small">COCKPIT GUIDE</text><text x="24" y="88" class="serif ink h1">投資判断コックピット</text><text x="24" y="115" class="sans muted body">最初の30秒で見る3点</text><rect class="panel" x="24" y="145" width="252" height="82" rx="12"/><text x="42" y="177" class="sans ink h2">1. 前回から何が変わった？</text><text x="42" y="202" class="sans muted small">重要差分を最初に読む</text><rect class="panel" x="24" y="240" width="252" height="82" rx="12"/><text x="42" y="272" class="sans ink h2">2. 市場期待との差</text><text x="42" y="297" class="sans muted small">UNAVAILABLEは推測しない</text><rect class="panel" x="24" y="335" width="252" height="82" rx="12"/><text x="42" y="367" class="sans ink h2">3. Warning / Thesis</text><text x="42" y="392" class="sans muted small">詳細は後段へ</text><text x="24" y="470" class="sans brass small">内部contract refsはdetailsへ</text></g><g transform="translate(400 150)"><rect class="phone" x="0" y="0" width="300" height="720" rx="26"/><text x="24" y="50" class="sans muted small">COMPANIES</text><text x="24" y="88" class="serif ink h1">企業を理解する</text><text x="24" y="116" class="sans muted body">事業・利益構造・仮説を確認</text><line x1="24" y1="145" x2="276" y2="145" stroke="#d4c8b6"/><text x="24" y="178" class="sans green h2">AI / 半導体</text><rect class="panel" x="24" y="196" width="252" height="92" rx="12"/><text x="42" y="227" class="sans ink h2">信越化学</text><text x="42" y="252" class="sans muted small">材料・基盤 / Research</text><rect class="panel" x="24" y="300" width="252" height="92" rx="12"/><text x="42" y="331" class="sans ink h2">日東紡</text><text x="42" y="356" class="sans muted small">ガラスクロス / Research</text><text x="24" y="438" class="sans brass small">categoryは巨大marginではなくtype/dividerで分離</text></g><g transform="translate(740 150)"><rect class="phone" x="0" y="0" width="300" height="720" rx="26"/><text x="24" y="50" class="sans muted small">TRADE JOURNAL</text><text x="24" y="88" class="serif ink h1">売買を振り返る</text><text x="24" y="128" class="sans green h2">2026</text><text x="24" y="160" class="sans ink h2">August</text><rect class="panel" x="24" y="178" width="252" height="76" rx="12"/><text x="42" y="207" class="sans ink h2">8月13日</text><text x="42" y="232" class="sans muted small">取引記録 3件</text><rect class="panel" x="24" y="266" width="252" height="76" rx="12"/><text x="42" y="295" class="sans ink h2">8月12日</text><text x="42" y="320" class="sans muted small">取引記録 2件</text><rect class="panel" x="24" y="354" width="252" height="76" rx="12"/><text x="42" y="383" class="sans ink h2">8月11日</text><text x="42" y="408" class="sans muted small">取引記録 1件</text><text x="24" y="468" class="sans brass small">年→月→日付を連続階層として読む</text></g><g transform="translate(1080 150)"><rect class="phone" x="0" y="0" width="300" height="720" rx="26"/><text x="24" y="50" class="sans muted small">HOME</text><text x="24" y="88" class="serif ink h1">今日の投資判断</text><text x="24" y="116" class="sans muted body">市場 → 自分への影響 → 今日見る</text><rect class="panel" x="24" y="145" width="252" height="98" rx="12"/><text x="42" y="176" class="sans green h2">今日見る</text><text x="42" y="201" class="sans ink body">朝の市場状況</text><text x="42" y="223" class="sans muted small">Freshness / status</text><rect class="panel" x="24" y="255" width="252" height="98" rx="12"/><text x="42" y="286" class="sans green h2">自分への影響</text><text x="42" y="311" class="sans ink body">Portfolio impact</text><text x="42" y="333" class="sans muted small">UNKNOWNはそのまま表示</text><rect class="panel" x="24" y="365" width="252" height="98" rx="12"/><text x="42" y="396" class="sans green h2">次の行動</text><text x="42" y="421" class="sans ink body">Cockpit / Pre-flight</text><text x="42" y="443" class="sans muted small">details間の大余白なし</text></g><text x="60" y="930" class="sans muted body">Acceptance: 320/390px overflowなし · first viewportで本題が見える · internal refsは後段 · desktop regressionなし</text></svg>