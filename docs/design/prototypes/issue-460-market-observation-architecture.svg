<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">#460 Market Observation Architecture</title><desc id="desc">Owner-facing market observation view separating session, freshness, capability, observation values and unavailable fields.</desc><rect width="1200" height="760" fill="#f2eee5"/><text x="56" y="66" font-family="serif" font-size="34" font-weight="700" fill="#211f19">Market Observation</text><text x="56" y="100" font-family="sans-serif" font-size="17" fill="#6f685c">何を見ているか / いつの情報か / 何が取れないか</text><rect x="56" y="138" width="1088" height="116" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="84" y="178" font-family="sans-serif" font-size="14" fill="#6f685c">Session</text><text x="84" y="216" font-family="sans-serif" font-size="24" font-weight="700" fill="#211f19">PREOPEN_MID · 08:30</text><text x="500" y="178" font-family="sans-serif" font-size="14" fill="#6f685c">Capability</text><text x="500" y="216" font-family="sans-serif" font-size="24" font-weight="700" fill="#8c6f3d">UNKNOWN</text><text x="820" y="178" font-family="sans-serif" font-size="14" fill="#6f685c">Source timestamp</text><text x="820" y="216" font-family="sans-serif" font-size="18" fill="#211f19">08:29:42</text><text x="56" y="304" font-family="serif" font-size="24" font-weight="700" fill="#211f19">Current observation</text><g transform="translate(56 336)"><rect width="330" height="190" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="40" font-family="sans-serif" font-size="14" fill="#6f685c">Indicative open</text><text x="24" y="92" font-family="sans-serif" font-size="30" font-weight="700" fill="#284b3b">12,340</text><text x="24" y="132" font-family="sans-serif" font-size="13" fill="#6f685c">provider-defined expected open</text></g><g transform="translate(420 336)"><rect width="330" height="190" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="40" font-family="sans-serif" font-size="14" fill="#6f685c">Best bid / ask</text><text x="24" y="92" font-family="sans-serif" font-size="25" font-weight="700" fill="#211f19">12,320 / 12,350</text><text x="24" y="132" font-family="sans-serif" font-size="13" fill="#6f685c">indicative openとは別概念</text></g><g transform="translate(784 336)"><rect width="360" height="190" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="24" y="40" font-family="sans-serif" font-size="14" fill="#6f685c">Unavailable fields</text><text x="24" y="84" font-family="sans-serif" font-size="18" font-weight="700" fill="#8a443b">Market-order imbalance</text><text x="24" y="118" font-family="sans-serif" font-size="14" fill="#6f685c">取得できません</text><text x="24" y="150" font-family="sans-serif" font-size="13" fill="#6f685c">0 / neutralへ変換しない</text></g><rect x="56" y="574" width="1088" height="92" rx="16" fill="#fffdf7" stroke="#d4c8b6"/><text x="84" y="610" font-family="sans-serif" font-size="15" font-weight="700" fill="#211f19">Interpretation boundary</text><text x="84" y="642" font-family="sans-serif" font-size="14" fill="#6f685c">DAILY_ONLYをLIVEに見せない · provider failureをmarket negative signalへ変換しない · runtime/provider detailは後段へ</text></svg>