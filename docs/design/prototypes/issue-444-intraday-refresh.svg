<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">Sado Investment Codex — Intraday Market Refresh Prototype</title><desc id="desc">Owner-facing market delta surface showing freshness, Morning to Current changes, previous slot changes and review required.</desc>
<defs><style>.bg{fill:#f2eee5}.panel{fill:#faf8f2;stroke:#d6d0c3;stroke-width:1.5}.nav{fill:#173f35}.ink{fill:#1b201d}.muted{fill:#626860}.green{fill:#173f35}.brass{fill:#8f7748}.warn{fill:#8d3e3b}.stale{fill:#7c6540}.serif{font-family:'Noto Serif JP','Yu Mincho',serif}.sans{font-family:'Noto Sans JP',system-ui,sans-serif}.mono{font-family:ui-monospace,monospace}.small{font-size:15px}.body{font-size:18px}.label{font-size:16px;font-weight:700}.h2{font-size:25px;font-weight:700}.h1{font-size:40px;font-weight:700}.kpi{font-size:28px;font-weight:700}</style></defs>
<rect class="bg" width="1440" height="1020"/><rect class="nav" width="1440" height="74"/><text x="54" y="46" class="serif" fill="#f7f4eb" font-size="26" font-weight="700">Sado Investment Codex</text><text x="1020" y="45" class="sans" fill="#d9d2c4" font-size="15">HOME / MARKET / COCKPIT / EVIDENCE</text>
<text x="60" y="124" class="sans muted small">VISUAL PROTOTYPE · Issue #444 · v0.1</text><text x="60" y="172" class="serif ink h1">Intraday Market Refresh</text><text x="60" y="205" class="sans muted body">現在値ではなく、Morningから何が変わったかを読む。</text>
<rect class="panel" x="60" y="235" width="1320" height="102" rx="14"/><text x="88" y="267" class="sans muted small">Session / freshness</text><text x="88" y="301" class="mono ink body">AFTERNOON · observed 14:00 · source 13:59 · LIVE/DELAYED</text><text x="980" y="267" class="sans muted small">Morning baseline</text><text x="980" y="301" class="mono ink body">08:45 snapshot</text>
<text x="60" y="390" class="serif ink h2">Morning → Current · 主要変化</text>
<rect class="panel" x="60" y="414" width="405" height="176" rx="14"/><text x="86" y="447" class="sans muted small">Nikkei 225</text><text x="86" y="486" class="mono green kpi">+1.4%</text><text x="86" y="524" class="sans body">Morning比で上昇加速</text><text x="86" y="558" class="sans muted small">Previous slot +0.3%</text>
<rect class="panel" x="492" y="414" width="405" height="176" rx="14"/><text x="518" y="447" class="sans muted small">USD/JPY</text><text x="518" y="486" class="mono brass kpi">-0.8%</text><text x="518" y="524" class="sans body">円高方向へ反転</text><text x="518" y="558" class="sans muted small">Morning→Currentを主表示</text>
<rect class="panel" x="924" y="414" width="456" height="176" rx="14"/><text x="950" y="447" class="sans muted small">SOX / AI sentiment</text><text x="950" y="486" class="mono stale kpi">STALE</text><text x="950" y="524" class="sans body">最新性不足。変化を確定しない。</text><text x="950" y="558" class="sans warn label">Review Required</text>
<text x="60" y="644" class="serif ink h2">Review Required</text><rect class="panel" x="60" y="668" width="1320" height="150" rx="14"/><text x="88" y="704" class="sans warn label">要確認 · 円高反転 + 半導体freshness不足</text><text x="88" y="746" class="serif ink h2">朝の前提をそのまま使わない</text><text x="88" y="786" class="sans body">判断命令ではなく、Cockpitで再確認すべきMarket contextを提示する。</text><text x="1050" y="786" class="sans green label">市場詳細を見る →</text>
<rect class="panel" x="60" y="850" width="1320" height="96" rx="14"/><text x="88" y="884" class="sans muted small">Data boundary</text><text x="88" y="918" class="sans body">observed_at / source_timestamp / freshness_class / session_slot を分離。DAILY_ONLY・PARTIAL・MISSINGを正常表示しない。</text>
<text x="60" y="986" class="sans muted small">390px: freshness → Morning delta → Review Required · one delta = one compact card</text><text x="1380" y="986" text-anchor="end" class="sans muted small">#320 Visual Contract reuse</text>
</svg>